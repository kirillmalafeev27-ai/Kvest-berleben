# ---------- N3 (семя Акта II) ----------
- id: node_bogdan_underpaid
  title: "Недоплата"
  category: dilemma
  act: 2
  node: N3
  priority: 76
  once: true
  trigger: chain
  entry: { all: [ {flag: knows_bogdan}, {counter_gte: {bogdan_shifts: 3}}, {flag_not: node_bogdan_underpaid_done} ] }
  stakes: medium
  location: baustelle
  targets: [npc_bogdan]
  facts:
    - "Богдан суёт смятые купюры — половины обещанного не хватает."
  intro: "БОГДАН: «Держи. За три дня.» (денег вдвое меньше уговора)"
  branches:
    - id: demand
      match: { verbs: [persuade, refuse, threaten], tone: [aggressive] }
      skill_check: { skill: hladnokrovie, vs: 35, plus: { ulitsa: 0.3 } }
      outcomes:
        - on: success
          text: "Ты твёрдо требуешь своё. Богдан долго смотрит, потом хмыкает: «Зубы есть. Уважаю.» Достаёт остальное."
          effects: { money: 75, set_flags: [node_bogdan_underpaid_done, bogdan_respect], rumor: {tag: "не дал себя кинуть", faction: black_employers, intensity: 0.5} }
          deltas: { P: 3, G: 2 }
          leads_to: "уважение бригады; стабильный (грубый) доход"
        - on: fail
          text: "«Не нравится — вон биржа.» Ты уходишь с половиной и испорченными отношениями."
          effects: { money: 25, set_flags: [node_bogdan_underpaid_done] }
          deltas: { P: 1, G: 2 }
    - id: swallow
      match: { verbs: [refuse, rest, apologize] }
      outcomes:
        - on: always
          text: "Ты молча берёшь половину. Богдан даже не смотрит. 🏷 «слабый, можно кидать»."
          effects: { money: 25, set_flags: [node_bogdan_underpaid_done, bogdan_marks_weak], rumor: {tag: "слабый, можно кидать", faction: black_employers, intensity: 0.5} }
          deltas: { P: -3 }
          leads_to: "тебя будут недоплачивать и дальше"
    - id: via_victor
      match: { verbs: [ask_help] }
      requires: [ {flag: knows_victor} ]
      outcomes:
        - on: always
          text: "Ты идёшь к Виктору. Тот «решает» — деньги возвращаются. Но теперь ты должен Виктору."
          effects: { money: 75, set_flags: [node_bogdan_underpaid_done, owes_victor], leaning: { crime: 1 } }
          deltas: { L: -2 }
          leads_to: "долг Виктору вернётся услугой (арка E)"
  fallback: { text: "Богдан уже отвернулся к бетономешалке.", reopen: true }

# ---------- РЕАКТИВНЫЕ / ФОНОВЫЕ ----------
- id: ubahn_control
  title: "Контролёры в U-Bahn"
  category: pressure
  act: 1
  node: N
  priority: 60
  trigger: reactive
  cooldown_days: 3
  entry: { all: [ {flag: moved_without_ticket}, {location_in: ubahn} ] }
  stakes: medium
  location: ubahn_station
  targets: [npc_controller]
  facts:
    - "Двое контролёров в штатском перекрыли выход. Действительного билета нет. Штраф 60 €."
  intro: "КОНТРОЛЁР: «Fahrschein, bitte.»"
  branches:
    - id: pay
      match: { verbs: [give, trade, submit_docs], methods: [money, buy] }
      requires: [ {money_gte: 60} ]
      outcomes:
        - on: always
          text: "Ты платишь штраф. Контролёр кивает. −60 €."
          effects: { money: -60, unset_flags: [moved_without_ticket] }
          deltas: { L: 1 }
    - id: talk_out
      match: { verbs: [persuade, deceive, beg], methods: [pity] }
      skill_check: { skill: deutsch, vs: 40, plus: { ubezhdenie: 0.5 } }
      outcomes:
        - on: success
          text: "«Beim nächsten Mal!» — контролёр машет рукой. Пронесло."
          effects: { unset_flags: [moved_without_ticket] }
          deltas: { T: -2 }
          skill_xp: { deutsch: 3 }
        - on: fail
          text: "Не верит. Штраф 60 € и заметка о попытке обмана."
          effects: { money: -60, unset_flags: [moved_without_ticket], dossier: "попытка обмана контроля" }
          deltas: { T: -3 }
    - id: run
      match: { verbs: [flee, hide] }
      skill_check: { skill: ulitsa, vs: 50 }
      outcomes:
        - on: success
          text: "Ты ныряешь в толпу и выскакиваешь на Karl-Marx-Straße. Сердце колотится."
          effects: { unset_flags: [moved_without_ticket], stress: 8 }
          deltas: { L: -2, G: 1 }
          skill_xp: { ulitsa: 3, hladnokrovie: 2 }
        - on: fail
          text: "Хватают за рукав. Теперь и штраф, и подозрение, и проверка документов..."
          effects: { money: -60, unset_flags: [moved_without_ticket], stress: 15 }
          deltas: { L: -3 }
    - id: scandal
      match: { verbs: [threaten, attack], tone: [aggressive] }
      outcomes:
        - on: always
          text: "Ты скандалишь. Пассажиры косятся, контролёр вызывает наряд BVG. Штраф никуда не делся."
          effects: { money: -60, unset_flags: [moved_without_ticket], rumor: {tag: "скандальный", faction: neighbors, intensity: 0.4} }
          deltas: { G: 4, P: 2, L: -1 }
  fallback: { text: "«Fahrschein, bitte», — повторяет контролёр. Тянуть нельзя.", reopen: true }

