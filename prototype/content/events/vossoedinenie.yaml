    - "Зейнеп знает, что продление скоро. Она говорит о своём опыте — когда она решала, уходить или оставаться."
    - "Вопрос не в том, что «правильно». Вопрос — что ты выбираешь."
  intro: "ЗЕЙНЕП: «Ты думала, что будешь делать если... ну просто если?»"
  branches:
    - id: speak_heart
      match: { verbs: [talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты говоришь. О том, чего хочешь — не роли, не репутации. Зейнеп слушает. «Это звучит как человек, который знает.» Перед развязкой это важно."
          effects: { set_flags: [voss_zeynep_final, voss_knows_self] }
          deltas: { P: 4, T: 2 }
          leads_to: "ты определилась; внутренняя ясность перед N9"
    - id: unsure_talk
      match: { verbs: [talk], honesty: [half_truth] }
      outcomes:
        - on: always
          text: "Ты говоришь — и не договариваешь. Зейнеп кивает: «Нормально. Иногда нужно немного больше времени.»"
          effects: { set_flags: [voss_zeynep_final] }
          leads_to: "неопределённость сохраняется; N9 сложнее"
    - id: ask_zeynep_choice
      match: { verbs: [ask_help, inquire_status] }
      outcomes:
        - on: always
          text: "«А ты как решила?» Зейнеп долго молчит. «Я решила, что лучше пожалеть о том, что сделала, чем о том, что нет. Ich hab das auch durchgemacht.»"
          effects: { set_flags: [voss_zeynep_final] }
          deltas: { P: 3 }
          leads_to: "Зейнеп как зеркало своего пути"
  fallback: { text: "Зейнеп смотрит на воду.", reopen: true }

# Примирение с семьёй (опциональное)
- id: vossoedinenie_family_reconcile
  title: "Кухня ночью"
  category: community
  act: 3
  priority: 58
  once: true
  trigger: chain
  entry: { all: [ {flag: family_knows_truth}, {day_gte: 55}, {flag_not: voss_family_reconcile} ] }
  stakes: medium
  location: altbau_flat
  targets: [npc_yildiz_anne]
  facts:
    - "Поздно. Йылдыз-ханым не спит — сидит на кухне с чаем."
    - "Это не объяснение и не прощение. Это просто ночь."
  intro: "ЙЫЛДЫЗ-ХАНЫМ: «Садись. Я сделала çay. (чай)»"
  branches:
    - id: sit_and_talk
      match: { verbs: [talk, befriend], honesty: [truthful, half_truth] }
      outcomes:
        - on: always
          text: "Вы сидите и пьёте чай. Она говорит про свой приезд — сорок лет назад, тоже молодая, тоже испуганная. «Мне тоже было трудно. Я не умела сказать.» Ты слушаешь. Это не прощение — но это что-то."
          effects: { set_flags: [voss_family_reconcile, yildiz_softer] }
          deltas: { A: 3, T: 2 }
          faction: { turkish: 4 }
          leads_to: "Йылдыз-ханым стала ближе; шанс на ending_legal"
    - id: polite_silence
      match: { verbs: [rest, observe] }
      outcomes:
        - on: always
          text: "Ты молча пьёшь чай. Она тоже. Это тоже разговор."
          effects: { set_flags: [voss_family_reconcile] }
          deltas: { A: 1 }
          leads_to: "мир неполный, но есть"
  fallback: { text: "Чай остывает.", reopen: true }

# ============================================================
# N9 — продление ВНЖ / развязка (КУЛЬМИНАЦИЯ)
# ============================================================

- id: vossoedinenie_n9_renewal
  title: "Ausländerbehörde: продление"
  category: dilemma
  act: 3
  node: N9
  priority: 98
  once: true
  trigger: scheduled
  day: 65
  entry: { all: [] }
  stakes: extreme
  location: auslaenderbehoerde
  targets: [npc_frau_becker]
  facts:
    - "Talonstunde (приём). Тебя вызывают. На столе — всё, что накопилось: справка курса, отношения в семье, документы."
    - "ВНЖ по Familiennachzug продлевается, если курс идёт и нет оснований для отказа."
    - "Но ты сама знаешь — это не только про документы."
  intro: "ФРАУ БЕККЕР: «Setzen Sie sich, bitte. (Присаживайтесь, пожалуйста.) Wir schauen alles durch. (Посмотрим всё.)» В руках — твоё дело."
  branches:
    # Порядок важен: первый подходящий по requires = концовка
    - id: ending_deport_branch
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, talk, refuse, rest, apply] }
      requires: [ {flag: family_caught_lying}, {flag_not: has_kurs_certificate} ]
      outcomes:
        - on: always
          text: "Ложь всплыла в деле. Курс не подтверждён. Инспектор зачитывает решение об отказе. «Es tut mir leid.» Тебе даётся 30 дней. Семья не поможет — они сами в растерянности. Ты собираешь вещи с достоинством. Эта история не кончается — она продолжается там, откуда начиналась. (КОНЦОВКА: депортация → новая глава)"
          effects: { set_flags: [ending_deport, game_over] }
          leads_to: "⑤ депортация"
    - id: ending_legal_branch
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, talk, apply, rest, give] }
      requires: [ {flag: has_kurs_certificate}, {flag: voss_has_income}, {any_flag: [voss_family_reconcile, suleyman_defended, zeynep_spoke_up]}, {flag: voss_knows_self} ]
      outcomes:
        - on: always
          text: "Справка курса. Подтверждение дохода. Семья, которая — несмотря ни на что — стоит рядом. Фрау Беккер ставит штамп: продление на два года с правом работы. «Herzlichen Glückwunsch. (Поздравляю.)» Зейнеп звонит сразу: «Ich wusste es. (Я знала.)» Это не конец истории — это её середина, честная. (КОНЦОВКА: autonomy_legal — своя автономия + ВНЖ с семьёй по-доброму)"
          effects: { set_flags: [ending_legal, game_over] }
          deltas: { P: 2, T: 1 }
          leads_to: "① автономия + семья + ВНЖ"
    - id: ending_exit_branch
      match: { verbs: [refuse, observe, inspect_self, talk, rest] }
      requires: [ {flag: has_kurs_certificate}, {axis_gte: {P: 35}}, {flag_not: voss_family_reconcile}, {any_flag: [zeynep_bond_2, voss_knows_status_independent]} ]
      outcomes:
        - on: always
          text: "ВНЖ технически продлевается — ты выполнила условия. Но ты знаешь: возвращаться в ту квартиру не получится. Ты берёшь документы. Благодаришь Зейнеп. Звонишь Херцог. У тебя есть права, язык, немного денег и понимание, чего стоят эти вещи. Достаточно, чтобы начать иначе. (КОНЦОВКА: выход с достоинством — риск, но своя жизнь)"
          effects: { set_flags: [ending_exit, game_over] }
          deltas: { P: 3 }
          leads_to: "④ выход с достоинством"
    - id: ending_gray_branch
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, talk, apply, rest] }
      requires: [ {flag: has_kurs_certificate}, {axis_lte: {P: 10}}, {flag: voss_chose_role} ]
      outcomes:
        - on: always
          text: "ВНЖ продлён. Всё по правилам. Ты возвращаешься домой — в квартиру, к Йылдыз-ханым, к привычному вечеру. Семья довольна. Ты тоже, почти. Что-то осталось несказанным — но это можно не называть. Берлин большой, а квартира маленькая и тёплая. Это тоже жизнь. (КОНЦОВКА: серая стабильность — статус есть, роль принята)"
          effects: { set_flags: [ending_gray, game_over] }
          leads_to: "② серая стабильность"
    - id: ending_underground_branch
      match: { verbs: [observe, submit_docs, talk, rest, flee, hide] }
      requires: [ {flag_not: has_kurs_certificate}, {flag: voss_has_income}, {flag: voss_work_secret} ]
      outcomes:
        - on: always
          text: "Курс не закончен. Продление под вопросом. Ты уже давно живёшь параллельно — деньги, работа, жизнь вне семьи. Документы зависли в воздухе. Зейнеп знает людей, которые знают людей. Статус неформальный, жизнь продолжается. Тихо, осторожно, непросто. (КОНЦОВКА: серый путь — неформальная жизнь)"
          effects: { set_flags: [ending_underground, game_over] }
          leads_to: "③ подполье / серый"
    - id: ending_gray_default
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, talk, apply, rest, give, refuse] }
      outcomes:
        - on: always
          text: "ВНЖ продлён на год. Жизнь продолжается — не так, как планировалось, и не так, как боялась. Что-то осталось открытым. Это тоже ответ. (КОНЦОВКА: серая стабильность — подвешенное «пока что»)"
          effects: { set_flags: [ending_gray, game_over] }
          leads_to: "② серая стабильность (дефолт)"
  fallback: { text: "Фрау Беккер смотрит поверх очков. Решение ждёт.", reopen: true }
