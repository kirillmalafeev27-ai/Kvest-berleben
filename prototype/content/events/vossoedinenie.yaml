# Линия «ВОССОЕДИНЕНИЕ» — Familiennachzug, турецкая община, Берлин.
# Акты 1–3. Узлы N1–N9. 18+ событий.
# Герой: турчанка/турок ~24 лет, приехал(а) к семье/супругу.
# Старт: altbau_flat, флаг with_family, 60 €, таймер 70 дней «до продления».
# Центральная дилемма: автономия (PRIDE) vs семья/община (ALTRU→жертва собой).
# Гард-рейлы тона: семья — живые люди; без карикатур; на мрак — человечность; достоинство > жалость.

events:

# ============================================================
# АКТ I (дни 1–20): прибытие, первый контакт с системой, первые трещины
# ============================================================

# ---------- ДЕНЬ 1: прибытие ----------
- id: vossoedinenie_arrival
  title: "Первый вечер"
  category: arc
  act: 1
  priority: 100
  once: true
  trigger: scheduled
  day: 1
  entry: { all: [ {flag_not: voss_arrived} ] }
  stakes: trivial
  location: altbau_flat
  targets: [npc_yildiz_anne]
  facts:
    - "Ты в квартире семьи в Нойкёльне. Альтбау, третий этаж, запах специй из кухни."
    - "Свекровь Йылдыз-ханым накрыла стол. Ужин — по-турецки, шумно, все смотрят на тебя."
    - "При тебе 60 €, телефон, один чемодан. Комната — твоя, но дверь без замка."
    - "Виза: 70 дней до продления ВНЖ. Условие продления — пройти интеграционный курс."
  intro: "ЙЫЛДЫЗ-ХАНЫМ: «Gel, otur, ye. (Иди, садись, ешь.) Ты наконец здесь. Мы тебя ждали.» Тепло — и что-то ещё, что трудно назвать."
  branches:
    - id: join_warmly
      match: { verbs: [talk, befriend, offer_help], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты садишься, ешь, слушаешь. Йылдыз-ханым подкладывает тебе ещё. Тепло, шумно — и чуть тесно. Вечер проходит гладко."
          effects: { set_flags: [voss_arrived], faction: { turkish: 5 } }
          deltas: { A: 2, P: -1 }
          leads_to: "хороший старт в семье; Йылдыз-ханым отметила открытость"
    - id: polite_distance
      match: { verbs: [observe, rest], tone: [polite, neutral] }
      outcomes:
        - on: always
          text: "Ты улыбаешься, но держишься чуть в стороне. Устала с дороги. Йылдыз-ханым понимает — и не совсем."
          effects: { set_flags: [voss_arrived] }
          leads_to: "нейтральный старт; семья наблюдает"
    - id: ask_about_rules
      match: { verbs: [inquire_status, ask_help] }
      outcomes:
        - on: always
          text: "Ты осторожно спрашиваешь, как тут всё устроено. Йылдыз-ханым делает паузу: «Kızım, у нас всё просто. Вместе — значит вместе.» Конкретики нет."
          effects: { set_flags: [voss_arrived] }
          deltas: { P: 1 }
          leads_to: "правила не названы — это и есть правила"
  fallback: { text: "Стол накрыт. Йылдыз-ханым ждёт.", reopen: true }

# ---------- ДЕНЬ 2: N1 — интеграционный курс ----------
- id: vossoedinenie_n1_kurs
  title: "Первый день курса"
  category: dilemma
  act: 1
  node: N1
  priority: 90
  once: true
  trigger: scheduled
  day: 2
  entry: { all: [ {flag: voss_arrived}, {flag_not: voss_kurs_started} ] }
  stakes: medium
  location: buergeramt
  targets: [npc_frau_herzog]
  facts:
    - "Интеграционный курс — обязательное условие ВНЖ по Familiennachzug. 700 часов немецкого + ориентационный курс."
    - "Здесь — первый урок. Фрау Херцог раздаёт учебники. В группе: сириец, украинка, ещё одна турчанка."
    - "Семья хотела, чтобы Зейнеп тебя проводила. Но ты пришла одна."
  intro: "ФРАУ ХЕРЦОГ: «Willkommen. Schritt für Schritt. (Добро пожаловать. Шаг за шагом.) Меня зовут фрау Херцог. Давайте познакомимся.»"
  branches:
    - id: engage_actively
      match: { verbs: [talk, ask_help, apply], honesty: [truthful] }
      skill_check: { skill: deutsch, vs: 20 }
      outcomes:
        - on: success
          text: "Ты отвечаешь на немецком — неловко, но искренне. Херцог кивает с теплом. После урока она задерживается: «Nicht schlecht. (Неплохо.) Есть вопросы — спрашивайте.»"
          effects: { set_flags: [voss_kurs_started, knows_frau_herzog], faction: { volunteers: 3 } }
          deltas: { P: 1, T: 1 }
          skill_xp: { deutsch: 5 }
          leads_to: "Херцог замечает тебя; курс как точка опоры вне семьи"
        - on: fail
          text: "Слова путаются. Ты краснеешь. Херцог мягко переходит дальше. После урока украинка говорит: «У всех так в начале.»"
          effects: { set_flags: [voss_kurs_started, knows_frau_herzog] }
          deltas: { P: -1 }
          skill_xp: { deutsch: 2 }
          leads_to: "курс начат; стресс виден"
    - id: silent_observe
      match: { verbs: [observe, rest, hide] }
      outcomes:
        - on: always
          text: "Ты молчишь, слушаешь. Херцог не давит. К концу урока ты уже понимаешь чуть больше, чем в начале."
          effects: { set_flags: [voss_kurs_started, knows_frau_herzog] }
          skill_xp: { deutsch: 2 }
          leads_to: "курс начат; тихий старт"
    - id: ask_about_rights
      match: { verbs: [inquire_status, ask_help] }
      outcomes:
        - on: always
          text: "В перерыве ты спрашиваешь Херцог про ВНЖ и права. Она говорит аккуратно: «Курс — ваш. Не чей-то ещё. Закон на вашей стороне.» Что-то в этом задерживается."
          effects: { set_flags: [voss_kurs_started, knows_frau_herzog, knows_own_rights_hint] }
          deltas: { P: 1, T: 1 }
          skill_xp: { deutsch: 2 }
          leads_to: "семя осознанности; пригодится на N3"
  fallback: { text: "Фрау Херцог ждёт ответа. В группе тишина.", reopen: true }

# ---------- ДЕНЬ 4: Зейнеп — первое знакомство ----------
- id: vossoedinenie_meet_zeynep
  title: "Золовка"
  category: arc
  act: 1
  priority: 80
  once: true
  trigger: chain
  entry: { all: [ {flag: voss_kurs_started}, {flag_not: voss_met_zeynep} ] }
  stakes: low
  location: altbau_flat
  targets: [npc_zeynep]
  facts:
    - "Зейнеп — сестра мужа (или родственница в семье), 27 лет, работает в магазине тканей."
    - "Она единственная в семье, кто жил вне общины — год в Гамбурге."
    - "Йылдыз-ханым её немного побаивается, но любит."
  intro: "ЗЕЙНЕП: «Ну что, как первый день? Дали тебе отдельный ключ от квартиры?» Вопрос звучит невинно — и не очень."
  branches:
    - id: honest_with_zeynep
      match: { verbs: [talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты говоришь честно — что странно, тесно, непонятно. Зейнеп усмехается: «Хорошо, что хоть кому-то сказала. Мне тоже было так.» Это начало."
          effects: { set_flags: [voss_met_zeynep, zeynep_trusted], faction: { turkish: 2 } }
          deltas: { T: 2, P: 1 }
          leads_to: "Зейнеп — союзник автономии; открывает пути вне общины"
    - id: cautious_with_zeynep
      match: { verbs: [talk], honesty: [half_truth, omission] }
      outcomes:
        - on: always
          text: "Ты отвечаешь осторожно — «всё хорошо». Зейнеп смотрит с лёгкой улыбкой: «Ладно. Я здесь.»"
          effects: { set_flags: [voss_met_zeynep] }
          leads_to: "Зейнеп не закрыта, но дистанция пока есть"
    - id: ask_zeynep_about_freedom
      match: { verbs: [ask_help, inquire_status] }
      outcomes:
        - on: always
          text: "Ты спрашиваешь, как она живёт — работает, сама. Зейнеп говорит коротко: «Hadi ya, это долгая история. Но можно. Если сам(а) хочешь.»"
          effects: { set_flags: [voss_met_zeynep, zeynep_trusted] }
          deltas: { P: 2 }
          leads_to: "Зейнеп открывает тему автономии — семя N4"
  fallback: { text: "Зейнеп ждёт. Ключа тебе не дали.", reopen: true }

# ---------- ДЕНЬ 6: первое давление семьи ----------
- id: vossoedinenie_family_pressure_1
  title: "Вопрос на кухне"
  category: pressure
  act: 1
  priority: 75
  once: true
  trigger: chain
  entry: { all: [ {flag: voss_kurs_started}, {flag_not: voss_family_question_1} ] }
  stakes: medium
  location: altbau_flat
  targets: [npc_yildiz_anne, npc_suleyman]
  facts:
    - "Йылдыз-ханым спрашивает, не слишком ли много времени ты проводишь на курсе. «Нельзя ли делать это дома?»"
    - "Сулейман (муж/принимающий) молчит, но смотрит."
    - "Курс — условие ВНЖ. Это не обсуждается. Но тон разговора важнее содержания."
  intro: "ЙЫЛДЫЗ-ХАНЫМ: «Kızım, а зачем каждый день? Нельзя пропустить разок? Дом тоже не сам себя убирает.»"
  branches:
    - id: explain_calmly
      match: { verbs: [persuade, talk], honesty: [truthful], tone: [polite] }
      skill_check: { skill: deutsch, vs: 15 }
      outcomes:
        - on: success
          text: "Ты объясняешь: курс — закон, не выбор. «Без него продление не дадут.» Йылдыз-ханым кивает неохотно. Сулейман: «Ладно, мать.»"
          effects: { set_flags: [voss_family_question_1, family_knows_kurs_is_required] }
          deltas: { T: 1, P: 1 }
          leads_to: "семья поняла, но напряжение осталось"
        - on: fail
          text: "Слов не хватает. Йылдыз-ханым принимает молчание как согласие. «Отлично, завтра поможешь тёте Гюльсен переехать.»"
          effects: { set_flags: [voss_family_question_1], stress: 8 }
          deltas: { P: -1 }
          leads_to: "граница не удержана; семья начинает заполнять время"
    - id: submit_silently
      match: { verbs: [apologize, rest], tone: [submissive] }
      outcomes:
        - on: always
          text: "Ты соглашаешься пропустить один день. Йылдыз-ханым довольна. Но внутри что-то сжимается."
          effects: { set_flags: [voss_family_question_1], stress: 10 }
          deltas: { A: 2, P: -3 }
          leads_to: "ALTRU растёт, PRIDE падает; паттерн подчинения устанавливается"
    - id: refuse_firmly
      match: { verbs: [refuse], tone: [neutral, polite] }
      outcomes:
        - on: always
          text: "«Нет, я должна идти. Это обязательно.» Йылдыз-ханым замолкает. Сулейман смотрит в телефон. Первая настоящая граница."
          effects: { set_flags: [voss_family_question_1, family_tension_1] }
          deltas: { P: 3, A: -2 }
          faction: { turkish: -2 }
          leads_to: "репутация в семье чуть снизилась; PRIDE выросла"
  fallback: { text: "Йылдыз-ханым ждёт ответа, вытирая руки о фартук.", reopen: true }

# ---------- ДЕНЬ 8: прогулка с Зейнеп — первый шаг наружу ----------
- id: vossoedinenie_zeynep_walk
  title: "Прогулка"
  category: community
  act: 1
  priority: 65
  once: true
  trigger: chain
  entry: { all: [ {flag: voss_met_zeynep}, {flag_not: voss_outside_walk} ] }
  stakes: low
  location: sonnenallee_market
  targets: [npc_zeynep]
  facts:
    - "Зейнеп зовёт пройтись по Зонненаллее — рынок, кофе, воздух."
    - "Йылдыз-ханым молча смотрит как вы уходите."
    - "На улице — тесно и живо: турецкие лавки, арабские пекарни, немецкие кафе рядом."
  intro: "ЗЕЙНЕП: «Пойдём. Город — это не только квартира. Ich zeig dir was. (Покажу тебе кое-что.)»"
  branches:
    - id: go_open
      match: { verbs: [talk, befriend, observe] }
      outcomes:
        - on: always
          text: "Вы идёте. Зейнеп показывает, объясняет, смеётся. «Я провела здесь год в панике, потом поняла — это просто улица.» Ты дышишь чуть свободнее."
          effects: { set_flags: [voss_outside_walk, zeynep_bond_1], stress: -10 }
          deltas: { P: 2, A: -1 }
          leads_to: "связь с Зейнеп крепнет; мир вне квартиры становится реальным"
    - id: ask_about_work
      match: { verbs: [ask_help, inquire_status] }
      outcomes:
        - on: always
          text: "Ты спрашиваешь Зейнеп: как она нашла работу? Та рассказывает коротко — долго, через Херцог, через бюро. «Семья не обрадовалась. Но привыкли.»"
          effects: { set_flags: [voss_outside_walk, zeynep_bond_1, zeynep_told_work_path] }
          deltas: { P: 3 }
          skill_xp: { deutsch: 2 }
          leads_to: "информация о пути к работе; семя N2"
    - id: stay_cautious
      match: { verbs: [refuse, observe], tone: [submissive] }
      outcomes:
        - on: always
          text: "Ты идёшь, но держишься. Зейнеп не давит. «Всё нормально. Не надо сразу всё.»"
          effects: { set_flags: [voss_outside_walk] }
          leads_to: "нейтрально; Зейнеп по-прежнему рядом"
  fallback: { text: "Зейнеп ждёт у двери.", reopen: true }

# ============================================================
# N2 — первый шаг к автономии (работа/учёба вне дома)
# ============================================================

- id: vossoedinenie_n2_autonomy_step
  title: "Свои деньги"
  category: dilemma
  act: 1
  node: N2
  priority: 78
  once: true
  trigger: scheduled
  day: 12
  entry: { all: [ {flag: voss_kurs_started}, {flag_not: voss_n2_done} ] }
  stakes: high
  location: mehmet_kebab
  targets: [npc_mehmet, npc_hakan]
  facts:
    - "Мехмет ищет помощника несколько часов в неделю — лёгкая работа, деньги небольшие, но свои."
    - "Хакан из общины сказал семье, что видел тебя у Мехмета. Информация пойдёт к Йылдыз-ханым."
    - "По Familiennachzug работать можно — но семья об этом не знает (или делает вид)."
    - "Своих денег нет. 60 € кончатся скоро."
  intro: "МЕХМЕТ: «Evladım, мне нужен человек пару часов. Честно, кэшем. Вопросов лишних не задаю.»"
  branches:
    - id: take_work_secretly
      match: { verbs: [work, trade], honesty: [omission, half_truth] }
      outcomes:
        - on: always
          text: "Ты соглашаешься — и не говоришь семье. Деньги есть. Тайна тоже. Мехмет: «Yavaş yavaş, abi. Никуда не спешим.»"
          effects: { money: 40, set_flags: [voss_n2_done, voss_has_income, voss_work_secret], inc: { voss_secret_days: 1 } }
          deltas: { P: 3, T: -2, L: -1 }
          leads_to: "деньги есть, тайна растёт; семья узнает на N6"
    - id: take_work_openly
      match: { verbs: [work, talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты сначала говоришь дома. Йылдыз-ханым напрягается, но Зейнеп — неожиданно — встаёт на твою сторону: «По закону она может.» Короткий конфликт. Ты идёшь работать."
          effects: { money: 40, set_flags: [voss_n2_done, voss_has_income, voss_work_open, family_tension_1] }
          deltas: { P: 5, T: 2, A: -3 }
          faction: { turkish: -3 }
          leads_to: "открытый конфликт, но чистая позиция; Зейнеп показала себя союзником"
    - id: refuse_work
      match: { verbs: [refuse, rest], tone: [submissive] }
      outcomes:
        - on: always
          text: "Ты отказываешься — не хочется лишнего напряжения. Мехмет понимает. Деньги кончатся. Зависимость от семьи — нет."
          effects: { set_flags: [voss_n2_done] }
          deltas: { A: 3, P: -4 }
          leads_to: "ALTRU растёт; зависимость от семьи усиливается"
    - id: ask_about_rights_work
      match: { verbs: [inquire_status, ask_help] }
      outcomes:
        - on: always
          text: "Ты идёшь к Херцог на следующий день и спрашиваешь про права. «По вашей визе — да, можно работать. Это закон.» Ты записываешь. Теперь знаешь."
          effects: { set_flags: [voss_n2_done, knows_work_rights] }
          deltas: { P: 2, T: 1 }
          skill_xp: { deutsch: 3 }
          leads_to: "знание своих прав — актив на N3"
  fallback: { text: "Мехмет ждёт ответа. Деньги в кошельке не прибавляются.", reopen: true }

# ============================================================
# АКТ II (дни 20–50): N3, N4, N5, N8 — конфликты и союзники
# ============================================================

# N3 — конфликт с контролирующим членом семьи
- id: vossoedinenie_n3_conflict
  title: "Разговор мужского рода"
  category: dilemma
  act: 2
  node: N3
  priority: 85
  once: true
  trigger: scheduled
  day: 22
  entry: { all: [ {flag: voss_n2_done}, {flag_not: voss_n3_done} ] }
  stakes: high
  location: altbau_flat
  targets: [npc_suleyman, npc_yildiz_anne]
  facts:
    - "Сулейман узнал о работе или о времени вне дома — через Хакана или сам заметил."
    - "Разговор происходит вечером. Йылдыз-ханым на кухне — слышит, не входит."
    - "ВНЖ привязан к семье. Разрыв = потеря статуса + жилья. Но молчать — тоже цена."
  intro: "СУЛЕЙМАН: «Мы должны поговорить. Люди говорят. Это на нас падает, понимаешь?»"
  branches:
    - id: stand_ground
      match: { verbs: [refuse, persuade], tone: [polite, neutral], honesty: [truthful] }
      skill_check: { skill: deutsch, vs: 25 }
      outcomes:
        - on: success
          text: "«Я никого не подвела. Я хожу на курс. Я работаю по закону. Это хорошо для семьи, не плохо.» Сулейман молчит. Потом: «Ладно. Но тише.» Неловкий мир."
          effects: { set_flags: [voss_n3_done, suleyman_knows, family_uneasy_truce] }
          deltas: { P: 5, T: 2, A: -3 }
          skill_xp: { deutsch: 4 }
          leads_to: "автономия отстояна — дорогой ценой репутации внутри семьи"
        - on: fail
          text: "Слова путаются. Сулейман слышит не то. «Вот именно.» Разговор кончается без ответа. Ты уходишь в комнату."
          effects: { set_flags: [voss_n3_done, suleyman_disappointed], stress: 15 }
          deltas: { P: -2, T: -1 }
          leads_to: "конфликт не закрыт; тлеет"
    - id: apologize_keep_peace
      match: { verbs: [apologize, rest], tone: [submissive] }
      outcomes:
        - on: always
          text: "Ты извиняешься. Не за что именно — просто чтобы закончить. Йылдыз-ханым входит с чаем. «Вот и ладно.» Мир восстановлен. И что-то потеряно."
