      outcomes:
        - on: always
          text: "Ты смотришь на Кофи и не знаешь, что сказать. Или не хочешь — ещё не готов. Эммануэль берёт Кофи к себе. Ты уходишь в свой угол."
          effects: { set_flags: [n8_done] }
          leads_to: "зеркало не сработало — но это тоже ответ"
  fallback: { text: "Эммануэль смотрит на тебя. Кофи ждёт.", reopen: true }

# ---------- ДЕНЬ 40: УСТАЛОСТЬ ----------
- id: nevidimka_shadow_fatigue
  title: "Тяжесть тени"
  category: pressure
  act: 3
  priority: 50
  trigger: pool
  weight: 1.2
  cooldown_days: 5
  entry: { all: [ {flag: has_black_income}, {counter_gte: {black_shifts: 3}} ] }
  stakes: medium
  location: any
  targets: []
  facts:
    - "Месяц в невидимости. Усталость другого рода — не от работы, от постоянного напряжения. Нельзя расслабиться нигде."
    - "Кваме называет это «shadow tax» — цена жизни в тени: не деньги, а нервы."
  intro: "Ты просыпаешься ночью от ерунды — показалось, кто-то в дверь. Никого. Тело уже не отличает угрозу от тишины."
  branches:
    - id: church_refuge
      match: { verbs: [rest, move, ask_help] }
      outcomes:
        - on: always
          text: "Ты идёшь в церковь просто посидеть. Никто не спрашивает зачем. Акуа ставит кофе. Барабаны репетируют к воскресенью. Ты сидишь час — и становится чуть легче. Не лучше, но легче."
          effects: { stress: -20, hunger: -10 }
          deltas: { A: 1 }
          leads_to: "церковь как психологический якорь"
    - id: talk_kwame_fatigue
      match: { verbs: [talk, befriend] }
      outcomes:
        - on: always
          text: "Ты говоришь Кваме: тяжело. Он долго молчит. «You know what the hard part is? You start forgetting what it feels like to not be afraid.» Это не утешение. Но это правда, и правда помогает по-другому."
          effects: { stress: -10, inc: { kwame_trust: 1 } }
          deltas: { T: 1 }
          leads_to: "доверие Кваме растёт"
  fallback: { text: "Ночь тихая. Слишком.", reopen: true }

# ---------- ДЕНЬ 45: ВОЗМОЖНОСТЬ УЕХАТЬ ----------
- id: nevidimka_exit_option
  title: "Письмо из дома"
  category: arc
  act: 3
  priority: 60
  once: true
  trigger: scheduled
  day: 45
  entry: { all: [ {flag_not: exit_option_seen} ] }
  stakes: medium
  location: storefront_church
  targets: [npc_pastor_emmanuel]
  facts:
    - "Из дома пришло сообщение. Дядя предлагает помочь вернуться — есть деньги на билет, есть место."
    - "Это не плохой вариант. Берлин не для всех. Но ты ещё не знаешь, чего хочешь."
  intro: "Телефон вибрирует. Дядя: «Come home, nephew. We miss you. It's not worth it.»"
  branches:
    - id: consider_exit
      match: { verbs: [talk, observe, rest], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты говоришь Эммануэлю про сообщение. Он не давит: «Only you know your answer. What brought you here?» Ты молчишь долго. Потом говоришь что-то — не вслух, только себе."
          effects: { set_flags: [exit_option_seen], stress: -10 }
          deltas: { P: 2 }
          leads_to: "вариант выхода остаётся открытым до N9"
    - id: reject_exit_firmly
      match: { verbs: [refuse, talk], honesty: [truthful], tone: [neutral, polite] }
      outcomes:
        - on: always
          text: "Ты пишешь дяде: ещё нет. Не объясняешь зачем — он не поймёт. Ты сам едва понимаешь. Но нет."
          effects: { set_flags: [exit_option_seen, rejected_exit] }
          deltas: { P: 3 }
          leads_to: "остаёшься — путь в Берлине продолжается до N9"
  fallback: { text: "Телефон снова вибрирует. Дядя ждёт ответа.", reopen: true }

# ---------- N9: РАЗВЯЗКА ----------
- id: nevidimka_node_resolution
  title: "Момент настоящего"
  category: dilemma
  act: 3
  node: N9
  priority: 99
  once: true
  trigger: scheduled
  day: 55
  entry: { all: [ {flag_not: n9_done}, {flag: n8_done} ] }
  stakes: extreme
  location: storefront_church
  targets: [npc_pastor_emmanuel]
  facts:
    - "Пастор Эммануэль говорит: Фрау Бергер может подать документы на следующей неделе. Последний шанс для пути через систему."
    - "Кваме говорит: у него есть работа в другом городе — надёжнее, меньше светишься. Предлагает уехать вместе."
    - "Дядя ещё ждёт. Билет домой реален."
    - "Всё, что ты накопил за эти недели — связи, выборы, факты в базе — сходится здесь."
  intro: "Ты стоишь у окна церкви. Берлин внизу — как всегда, без тебя в расчёте. Эммануэль подходит: «Brother. It's time to choose what comes next.»"
  branches:
    # Концовка 1: ЛЕГАЛИЗАЦИЯ (legal)
    # Условие: шёл легальным путём, поручительство или убежище, не засвечен критично
    - id: ending_legal_path
      match: { verbs: [apply, submit_docs, ask_help, talk], honesty: [truthful] }
      requires:
        - any_flag: [vouching_path_active, asylum_option_known]
        - flag: lawyer_meeting_done
        - flag_not: detained_high_exposed
      outcomes:
        - on: always
          text: "Ты говоришь: да. Бергер подаёт документы. Поручитель подтверждает. Процесс долгий — месяцы, может быть. Но ты в системе — официально, с правом на ответ. Это не победа ещё. Это шанс. Эммануэль: «Now you have a name here. It's hard to take away what has a name.» Новая глава."
          effects: { set_flags: [n9_done, ending_legal, game_over] }
          deltas: { T: 2, L: 2, P: 1 }
          leads_to: "① легализация — редко, дорого, по-настоящему"
    # Концовка 2: СЕРАЯ СТАБИЛЬНОСТЬ (gray)
    # Условие: теневой путь, не засвечен критично, не уходит
    - id: ending_gray_stability
      match: { verbs: [hide, talk, rest, observe] }
      requires:
        - flag: shadow_path_chosen
        - flag_not: system_knows
        - flag_not: rejected_exit
      outcomes:
        - on: always
          text: "Ты остаёшься — не здесь, но в Берлине. Другой район, другие смены, те же правила Кваме. Это не стабильность на бумаге. Это равновесие на натянутой верёвке. Ты уже умеешь ходить по ней. Кваме: «Welcome to the permanent temporary.» Ты понимаешь иронию. И улыбаешься."
          effects: { set_flags: [n9_done, ending_gray, game_over] }
          leads_to: "② серая стабильность — устойчивая, вечно рискующая"
    # Концовка 3: ПОДПОЛЬЕ (underground)
    # Условие: криминальный уклон, фиктивный брак или серые схемы глубоко
    - id: ending_underground_path
      match: { verbs: [hide, move, trade, give] }
      requires:
        - any_flag: [fake_marriage_arranged, passed_kwame_wisdom]
        - leaning_gte: { gray: 4 }
      outcomes:
        - on: always
          text: "Ты уходишь глубже — туда, где тебя не ищут. Новое имя, другой район, другие люди. Ты стал частью контура — не из выбора, из необходимости. Теперь ты сам тянешь кого-то сюда. Ты помнишь, каково это — быть Кофи. Это что-то значит. Что именно — ещё не ясно."
          effects: { set_flags: [n9_done, ending_underground, game_over] }
          leads_to: "③ подполье — глубже в контур"
    # Концовка 4: ВЫХОД (exit)
    # Условие: высокий PRIDE, или exit_option_seen без reject, или система знает
    - id: ending_exit_dignity
      match: { verbs: [move, refuse, talk], honesty: [truthful] }
      requires:
        - flag: exit_option_seen
        - flag_not: rejected_exit
      outcomes:
        - on: always
          text: "Ты пишешь дяде: еду. Пастор провожает тебя у двери. «You came. You tried. God sees that.» Ты не проиграл — ты выбрал. Берлин не принял тебя на своих условиях. Ты не принял его на его. Это не поражение. Это ответ на вопрос, который надо было задать раньше — или позже. Самолёт в обратную сторону. Другая глава."
          effects: { set_flags: [n9_done, ending_exit, game_over] }
          deltas: { P: 2 }
          leads_to: "④ выход с достоинством — сам, с поднятой головой"
    # Концовка 5: ДЕПОРТАЦИЯ (deport)
    # Условие: система знает, высокий exposed, задержан
    - id: ending_deport_caught
      match: { verbs: [talk, submit_docs, apply, rest, observe] }
      requires:
        - flag: detained_high_exposed
        - counter_gte: { exposed: 3 }
      outcomes:
        - on: always
          text: "Явка. Ты пришёл — или тебя нашли. Протокол. Решение. Тебе дают время собрать вещи — несколько дней. Эммануэль приходит в центр содержания. Сидит рядом. Не говорит ничего особенного — просто сидит. Самолёт. Аэропорт, другой. Ты выходишь в другой город — в который когда-то хотел вернуться. Или не хотел. Это случилось. Это — не конец. Это разворот."
          effects: { set_flags: [n9_done, ending_deport, game_over] }
          leads_to: "⑤ депортация — без чернухи, с достоинством, новая глава"
    # Дефолтная: серая стабильность (если ни одно условие не сработало)
    - id: ending_gray_default
      match: { verbs: [observe, inspect_self, talk, rest, apply, submit_docs, inquire_status, give, refuse, hide, move, search] }
      outcomes:
        - on: always
          text: "Ты остаёшься. Не потому что решил — просто время прошло, и ты здесь. В тени, в рутине, в невидимости. Это не то, о чём мечтают. Но это жизнь — и она продолжается."
          effects: { set_flags: [n9_done, ending_gray, game_over] }
          leads_to: "② серая стабильность по умолчанию"
  fallback: { text: "Берлин снаружи шумит. Ты у окна. Ответ нужен.", reopen: true }
