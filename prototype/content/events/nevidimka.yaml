# События линии «Невидимка», все акты (N1–N9 + наполнение).
# КАНОН: design/02_magistralnye_linii.md §2.7; тон: design/08 §8.4.
# Герой — западноафриканец ~27, без статуса; старт: storefront_church, 20 €, undocumented.
# Таймер «тень» — постоянная угроза, не срок; засвеченность = счётчик exposed.
# Гард-рейлы: профилирование системно (усталость/процедура/профиль), не карикатура;
#   церковь — безусловная, искренняя; полиция процедурна; достоинство героя важнее жалости.

events:

# ============================================================
# АКТ I — ПЕРВЫЕ ДНИNЫ: ОРИЕНТАЦИЯ В ТЕНИ
# ============================================================

# ---------- ДЕНЬ 1: СТАРТ ----------
- id: nevidimka_arrival
  title: "Первый рассвет"
  category: arc
  act: 1
  priority: 100
  once: true
  trigger: scheduled
  day: 1
  entry: { all: [ {flag_not: nevidimka_started} ] }
  stakes: trivial
  location: storefront_church
  targets: [npc_pastor_emmanuel]
  facts:
    - "Ты в церкви — storefront, бывший магазин, Веддинг. Пластиковые стулья, запах кофе и ткани."
    - "При тебе: 20 €, без документов, без адреса, без статуса. Таймер 'тень' отсчитывает не дни до срока — а дни до момента, когда тебя найдут."
    - "Пастор Эммануэль — первый, кто смотрит на тебя, а не сквозь тебя."
    - "Kwame — земляк, уже год здесь. Он снаружи, курит. Он знает, как это работает."
  intro: "ПАСТОР ЭММАНУЭЛЬ: «Brother. You look like you need a chair and something warm. No questions — come in.» (Брат. Похоже, тебе нужны стул и что-то горячее. Без вопросов — заходи.)"
  branches:
    - id: enter_church
      match: { verbs: [talk, rest, observe, ask_help, move] }
      outcomes:
        - on: always
          text: "Ты входишь. Акуа ставит перед тобой стакан чая. Эммануэль не спрашивает имени, документов, истории. Просто: есть место на полу на эту ночь. Ты впервые за долгое время выдыхаешь."
          effects: { set_flags: [nevidimka_started, met_pastor, church_safe], hunger: -20, stress: -15 }
          leads_to: "церковь — безопасная база; встреча с Кваме на следующий день"
    - id: stay_outside
      match: { verbs: [refuse, hide, flee] }
      outcomes:
        - on: always
          text: "Ты остаёшься снаружи. Ночь холодная. Кваме оглядывается: «Your call, man. Door's open.» (Твоё дело. Дверь открыта.) Ты знаешь, где найти убежище — если решишься."
          effects: { set_flags: [nevidimka_started], stress: 8 }
          leads_to: "можно вернуться к пастору позже"
  fallback: { text: "Эммануэль ждёт. Дверь открыта.", reopen: true }

# ---------- ДЕНЬ 2: ВСТРЕЧА С КВАМЕ ----------
- id: nevidimka_kwame_intro
  title: "Человек, который знает"
  category: arc
  act: 1
  priority: 90
  once: true
  trigger: chain
  entry: { all: [ {flag: nevidimka_started}, {flag_not: met_kwame} ] }
  stakes: low
  location: storefront_church
  targets: [npc_kwame]
  facts:
    - "Кваме — из Ганы, год в Берлине, Duldung истёк полгода назад. Знает районы, знает риски."
    - "Он не проводник в криминал — он просто реалист, который хочет, чтобы ты выжил."
    - "Главный урок Кваме: видимость — враг. Чем меньше замечают, тем лучше."
  intro: "КВАМЕ: «You're new. Don't go to Görlitzer, don't go to Hasenheide alone at night. They don't need a reason — your face is the reason.» (Ты новенький. Не ходи в Гёрлитцер, не ходи один в Хазенхайде ночью. Им не нужна причина — твоё лицо и есть причина.)"
  branches:
    - id: listen_kwame
      match: { verbs: [talk, ask_help, observe, inquire_status] }
      outcomes:
        - on: always
          text: "Кваме объясняет просто: легальная работа закрыта без статуса. Остаётся чёрный рынок — уборка, стройка, разгрузка. Платят кэшем, без вопросов. Но и без защиты. «I'm not saying it's good. I'm saying it's what there is.» (Не говорю, что это хорошо. Говорю — другого нет.)"
          effects: { set_flags: [met_kwame, kwame_advice_heard], leaning: { gray: 1 } }
          deltas: { T: 1 }
          leads_to: "Кваме открывает путь к теневому заработку; пастор — к легальному"
    - id: push_back
      match: { verbs: [refuse, persuade, talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты говоришь: должен быть способ. Кваме смотрит на тебя без насмешки: «There is. It's called 'get caught and hope for mercy'. I tried it.» Шрам у него на запястье — от наручника, не от драки."
          effects: { set_flags: [met_kwame] }
          deltas: { P: 1, T: 1 }
          leads_to: "Кваме не закрывается — уважает упрямство"
  fallback: { text: "Кваме докуривает, ждёт.", reopen: true }

# ---------- ДЕНЬ 3: N1 — ПЕРВЫЙ КОНТАКТ С РИСКОМ ЗАСВЕЧИВАНИЯ ----------
- id: nevidimka_node_exposure
  title: "Рутинная проверка"
  category: dilemma
  act: 1
  node: N1
  priority: 85
  once: true
  trigger: scheduled
  day: 3
  entry: { all: [ {flag: nevidimka_started}, {flag_not: n1_done} ] }
  stakes: high
  location: ubahn_station
  targets: [npc_cop_profiling]
  facts:
    - "U-Bahn, Веддинг. Полицейский — молодой, устал, смотрит в сторону платформы. Потом взгляд падает на тебя."
    - "Это Routinekontrolle — они проверяют в 'kriminalitätsbelastete Orte'. Ты попал в профиль — не по поступку, по виду."
    - "При тебе: нет документов. Засвечивание = риск депортации. Счётчик exposed растёт с каждым контактом с системой."
    - "Кваме предупреждал об этом. Сейчас ты понимаешь почему."
  intro: "ПОЛИЦЕЙСКИЙ: «Dokumente, bitte.» Рутина в голосе. Он уже смотрит не на тебя — на следующего."
  branches:
    - id: stay_calm_hide
      match: { verbs: [hide, flee, move] }
      skill_check: { skill: ulitsa, vs: 40 }
      outcomes:
        - on: success
          text: "Ты заходишь в вагон в последнюю секунду — двери закрываются. Сердце бьётся в горле. Полицейский даже не успевает среагировать. Ты в безопасности — пока."
          effects: { set_flags: [n1_done, first_close_call], stress: 12 }
          deltas: { G: 2 }
          skill_xp: { ulitsa: 4, hladnokrovie: 3 }
          leads_to: "засвечивания не было, но ты знаешь — это повторится"
        - on: fail
          text: "Полицейский видит рывок и это — уже не Routinekontrolle. «Stop.» Ты останавливаешься. Документов нет. Их забирают в участок на проверку. Ты там три часа. Они ничего не находят — пока — и отпускают. Но данные внесены."
          effects: { set_flags: [n1_done, first_close_call, police_data_entered], inc: { exposed: 1 }, stress: 25 }
          deltas: { G: 3 }
          leads_to: "засвечен частично; облава в N6 будет опаснее"
    - id: face_it_calm
      match: { verbs: [talk, hide, apologize], honesty: [truthful], tone: [polite, neutral] }
      skill_check: { skill: hladnokrovie, vs: 35 }
      outcomes:
        - on: success
          text: "Ты останавливаешься. Держишься ровно. «Dokumente habe ich gerade nicht dabei.» Немецкий хромает, но спокойствие — нет. Полицейский смотрит на тебя: нет причины задерживать. «Nächstes Mal dabei haben.» И уходит. Ты стоишь. Выдыхаешь."
          effects: { set_flags: [n1_done, first_close_call] }
          deltas: { P: 2 }
          skill_xp: { hladnokrovie: 5, deutsch: 3 }
          leads_to: "хладнокровие сработало; Кваме это оценит"
        - on: fail
          text: "Ты пытаешься объяснить — но нервы, немецкий, смятение. Полицейский вежливо, но непреклонно просит подождать. Коллега появляется через десять минут. Имя записано. «Wir prüfen das.» (Мы проверим.) Отпускают — по недостатку оснований. Но файл открыт."
          effects: { set_flags: [n1_done, first_close_call, police_data_entered], inc: { exposed: 1 }, stress: 20 }
          leads_to: "файл открыт — аукнется позже"
    - id: lie_identity
      match: { verbs: [deceive, talk], honesty: [lie] }
      skill_check: { skill: hladnokrovie, vs: 45 }
      outcomes:
        - on: success
          text: "Ты даёшь несуществующее имя. Полицейский записывает и отпускает — проверить без бумаг сложно. Ложь сработала. На этот раз. Но имя теперь лежит в базе."
          effects: { set_flags: [n1_done, first_close_call, lied_to_police], inc: { exposed: 1 }, dossier: "дал ложное имя при проверке" }
          deltas: { T: -3 }
          leads_to: "ложь в базе — мина на N6 и N9"
        - on: fail
          text: "Полицейский уточняет — имя, написание. Ты путаешься. «Kommen Sie mit, bitte.» Три часа в участке. Настоящих данных они так и не получают — но больше смотрят."
          effects: { set_flags: [n1_done, first_close_call, police_data_entered, lied_to_police], inc: { exposed: 2 }, stress: 25, dossier: "дал ложное имя, задержан для проверки" }
          deltas: { T: -4 }
          leads_to: "высокий exposed — облава N6 будет критической"
  fallback: { text: "Полицейский ждёт. Поезд уходит.", reopen: true }

# ---------- ДЕНЬ 4: N2 — ПЕРВЫЙ ЗАРАБОТОК/ЕДА ----------
- id: nevidimka_node_food_work
  title: "Чёрная биржа"
  category: dilemma
  act: 1
  node: N2
  priority: 82
  once: true
  trigger: scheduled
  day: 4
  entry: { all: [ {flag: met_kwame}, {flag_not: n2_done} ] }
  stakes: high
  location: arbeiterstrich
  targets: [npc_kwame]
  facts:
    - "Биржа подённого труда — рассвет, Веддинг. Разнорабочие, фургоны, люди у стены."
    - "Кваме знает здесь всех. Два варианта: уборка квартир — безопаснее, 30 € в день; разгрузка склада — тяжелее, 50 €, бригадир не спрашивает."
    - "Церковь: еда каждое утро, без условий. Но это не зарплата."
    - "20 € таят быстро. Транспорт, телефон — и ноль."
  intro: "КВАМЕ: «Church feeds you. But you need money. Here's how it works.»"
  branches:
    - id: church_food_only
      match: { verbs: [rest, move, refuse] }
      outcomes:
        - on: always
          text: "Ты решаешь пока держаться церкви. Акуа даёт тарелку каши и кофе — без вопросов, без благодарностей обязательных. Голод отступает. Деньги не появляются. Завтра придётся решить."
          effects: { set_flags: [n2_done, church_food_taken], hunger: -25 }
          deltas: { A: 1 }
          leads_to: "выживание без денег — временное; давление вернётся"
    - id: cleaning_work
      match: { verbs: [work, offer_help], methods: [labor, illegal_shift] }
      outcomes:
        - on: always
          text: "Ты идёшь с Кваме на уборку. Немецкая квартира, хозяйка не смотрит на лица — лишь бы чисто. Три часа, 30 €, кэш. Кваме: «Don't give your name. Don't say where you're from. In, clean, out.» Ты выполняешь инструкцию."
          effects: { money: 30, set_flags: [n2_done, has_black_income, knows_cleaning_work], fatigue: 15, leaning: { gray: 1 } }
          leads_to: "стабильный теневой доход; привязанность к серой схеме"
    - id: warehouse_work
      match: { verbs: [work], methods: [labor] }
      skill_check: { skill: ulitsa, vs: 30 }
      outcomes:
        - on: success
          text: "Тяжёлая смена на складе. Бригадир — молчаливый, 50 € в руку в конце. Ни имени, ни договора. Ты устал до кости, но в кармане деньги. Первые нормальные деньги."
          effects: { money: 50, set_flags: [n2_done, has_black_income, knows_warehouse_work], fatigue: 28, leaning: { gray: 1 } }
          skill_xp: { ulitsa: 4 }
          leads_to: "больше денег, больше усталости, глубже в контур"
        - on: fail
          text: "Ты не успеваешь за темпом. Бригадир молча платит меньше — 25 €. Ни скандала, ни объяснений. Ты берёшь и уходишь. Тело ноет."
          effects: { money: 25, set_flags: [n2_done, has_black_income], fatigue: 22, leaning: { gray: 1 } }
          leads_to: "деньги есть — достоинство щиплет"
  fallback: { text: "Кваме кивает на группу у стены. «Your choice.»", reopen: true }

# ---------- ДЕНЬ 5: ДАВЛЕНИЕ ДЕНЕГ ----------
- id: nevidimka_money_pressure
  title: "Двадцать евро"
  category: pressure
  act: 1
  priority: 55
  once: true
  trigger: pool
  weight: 1.5
  cooldown_days: 4
  entry: { all: [ {money_lt: 15}, {flag: n2_done} ] }
  stakes: medium
  location: any
  targets: []
  facts:
    - "Деньги кончаются. Транспорт, телефон, минимум еды — уже не влезает в бюджет."
    - "Церковь кормит, но это не решение навсегда."
  intro: "В кармане почти ничего. Ты считаешь монеты."
  branches:
    - id: church_again
      match: { verbs: [ask_help, move, rest, beg] }
      outcomes:
        - on: always
          text: "Ты идёшь в церковь. Акуа ставит тарелку молча. Эммануэль подсаживается: «We have a small fund. Not much. But it's yours.» Ты берёшь 10 €. Без долга. Непривычно."
          effects: { money: 10, hunger: -15, stress: -8, faction: { african_church: 3 } }
          deltas: { A: 1 }
          leads_to: "церковь как страховка — но она не бесконечна"
    - id: take_any_work
      match: { verbs: [work, offer_help, trade] }
      outcomes:
        - on: always
          text: "Ты соглашаешься на первое, что предлагает Кваме. Мойка окон — четыре часа, 20 €. Грязная работа, спина болит. Деньги есть."
          effects: { money: 20, fatigue: 18 }
          leads_to: "деньги решены ненадолго"
  fallback: { text: "Деньги сами не появятся.", reopen: true }

# ---------- ДЕНЬ 6: N3 — РАСОВОЕ ПРОФИЛИРОВАНИЕ ----------
- id: nevidimka_node_profiling
  title: "Профиль"
  category: dilemma
  act: 1
  node: N3
  priority: 80
  once: true
  trigger: scheduled
  day: 6
  entry: { all: [ {flag_not: n3_done} ] }
  stakes: high
  location: hasenheide_park
  targets: [npc_cop_profiling]
  facts:
    - "Парк Хазенхайде. Ты сидишь на скамейке — просто отдыхаешь. Ничего не делаешь."
    - "Полицейский патруль. Двое. Они идут вдоль аллеи. Один замечает тебя — секунда взгляда, разворот."
    - "Это 'kriminalitätsbelasteter Ort' — так называет место полицейская статистика. Ты здесь не торгуешь. Но ты здесь."
    - "Кваме объяснял это явление без ярости: система обозначила место, профиль — логика из него. Это не злость на тебя лично."
  intro: "ПОЛИЦЕЙСКИЙ: «Guten Tag. Routinekontrolle. Dokumente, bitte.» Второй делает шаг в сторону — закрывает выход."
  branches:
    - id: comply_documents
      match: { verbs: [submit_docs, talk, apologize], honesty: [truthful], tone: [polite, neutral] }
      outcomes:
        - on: always
          text: "Ты говоришь спокойно: документов нет. Они записывают, проверяют по базе. Ничего нет — пока. «Empfehlen wir, immer Ausweis dabeizuhaben.» (Рекомендуем всегда иметь при себе удостоверение.) Стандартная фраза. Они уходят к следующему. Ты остаёшься на скамейке. Парк продолжает жить."
          effects: { set_flags: [n3_done, profiling_experienced], inc: { exposed: 1 }, stress: 18 }
          deltas: { P: 2 }
          leads_to: "засвечен; внутренняя усталость от системы; Кваме поймёт"
    - id: ask_why
      match: { verbs: [inquire_status, talk, persuade], tone: [polite, neutral] }
      skill_check: { skill: hladnokrovie, vs: 30 }
      outcomes:
        - on: success
          text: "Ты спрашиваешь вежливо: почему именно здесь, почему я? Полицейский смотрит — не враждебно, но и без извинений. «Das ist Vorschrift für diesen Bereich.» (Предписание для этой зоны.) Ответ честный, пустой. Тебя отпускают. Ты сидишь и понимаешь: это не про тебя и именно про тебя одновременно."
          effects: { set_flags: [n3_done, profiling_experienced, understood_systemic], stress: 12 }
          deltas: { P: 2, G: 1 }
          skill_xp: { hladnokrovie: 4, deutsch: 2 }
          leads_to: "системное понимание; меньше растерянности в будущих стычках"
        - on: fail
          text: "Ты теряешь хладнокровие — не от злости, от усталости. Голос дрожит. Полицейский становится холоднее. Второй записывает всё. Отпускают, но с пометкой."
          effects: { set_flags: [n3_done, profiling_experienced], inc: { exposed: 1 }, stress: 22, dossier: "вёл себя неустойчиво при проверке" }
          leads_to: "exposed растёт; пометка в деле"
    - id: run_profiling
      match: { verbs: [flee, hide] }
      skill_check: { skill: ulitsa, vs: 45 }
      outcomes:
        - on: success
          text: "Ты встаёшь и быстро уходишь — не бежишь, но быстро. Они окликают, но ты уже в другой аллее. Ты знаешь этот парк. Они — нет. Сердце молотит."
          effects: { set_flags: [n3_done, profiling_experienced], stress: 20 }
          deltas: { G: 2 }
          skill_xp: { ulitsa: 5 }
          leads_to: "ушёл, но теперь будут смотреть здесь активнее"
        - on: fail
          text: "«Stop! Stehen bleiben!» Ты не успеваешь. Тебя догоняют. Теперь это уже не Routinekontrolle — это уклонение. Три часа в участке. Отпускают. Exposed сильно растёт."
          effects: { set_flags: [n3_done, profiling_experienced, police_data_entered], inc: { exposed: 2 }, stress: 30, dossier: "попытка скрыться при проверке" }
          leads_to: "высокий exposed — критично для N6"
  fallback: { text: "Полицейский ждёт. Второй стоит сбоку.", reopen: true }

# ---------- ДЕНЬ 8: СЛУЖБА В ЦЕРКВИ ----------
- id: nevidimka_church_service
  title: "Воскресная служба"
  category: community
  act: 1
  priority: 60
  once: true
  trigger: scheduled
  day: 8
  entry: { all: [ {flag: met_pastor}, {flag_not: church_service_done} ] }
  stakes: low
  location: storefront_church
  targets: [npc_pastor_emmanuel, npc_sister_akua]
  facts:
    - "Воскресенье. Тридцать человек в зале. Пластиковые стулья, живая музыка, барабаны."
    - "Языки мешаются: twi, yoruba, французский с акцентом — и иногда немецкий в молитве."
    - "Никто не спрашивает документов. Никто не спрашивает истории."
    - "Это место — единственное в городе, где ты просто человек, а не профиль."
  intro: "ПАСТОР ЭММАНУЭЛЬ: «We are not a waiting room. We are a home. Whoever comes — belongs.»"
  branches:
    - id: join_service
      match: { verbs: [rest, talk, observe, befriend, offer_help] }
      outcomes:
        - on: always
