# События линии «Война», Акт I (дни 1–14).
# Старт: plattenbau_flat, флаги [paragraph24, has_child], Deutsch 10, 400 €, таймер «статус §24».
# Главный конфликт: травма + «это временно» + вина выжившего + расщеплённая семья.
# Узлы Акт I: N1 (Jobcenter), N2 (пособие vs работа), N3 (русскоязычная среда), N4 (Оксана vs замкнуться).
# Гард-рейлы 8.4: достоинство героя, без смакования боли, языки звучат (uk/de с переводом).

events:

# ---------- ДЕНЬ 1: прибытие ----------
- id: voyna_arrival
  title: "Квартира, которая не твоя"
  category: arc
  act: 1
  priority: 100
  once: true
  trigger: scheduled
  day: 1
  entry: { all: [ {flag: paragraph24}, {flag_not: voyna_arrived} ] }
  stakes: trivial
  location: plattenbau_flat
  facts:
    - "Квартира немецкой семьи — чужие тарелки, чужие фотографии на стенах. Хозяева уехали на лето, оставили ключи."
    - "Дочь Соня, 7 лет, спит на диване. За окном — панелька Марцана, серая и почти знакомая."
    - "§24: статус есть, права есть. Bürgergeld можно оформить. Работать можно. Это всё — потом."
    - "Телефон молчит. Мужу ты написала три часа назад."
  intro: "Первый вечер в чужой квартире. Соня наконец заснула. Ты одна с телефоном в руках."
  branches:
    - id: call_home
      match: { verbs: [talk, ask_help] }
      outcomes:
        - on: always
          text: "Он берёт трубку — голос живой, устал. Говорите ни о чём: погода, как Соня, он ел. Когда вешаешь трубку — тише, чем было. И тяжелее. Он — там. Ты — здесь."
          effects: { set_flags: [voyna_arrived, called_home], stress: -5 }
          deltas: { T: 1 }
          leads_to: "звонок домой — ресурс и рана одновременно"
    - id: observe_room
      match: { verbs: [observe, inspect_self, search] }
      outcomes:
        - on: always
          text: "Ты идёшь по квартире, как по музею чужой жизни. На холодильнике магниты с Маллоркой. В ящике — немецкие таблетки, которые ты не знаешь. Всё не твоё. Соня спит."
          effects: { set_flags: [voyna_arrived], stress: 5 }
          leads_to: "ощущение временности с первого дня"
    - id: try_sleep
      match: { verbs: [rest] }
      outcomes:
        - on: always
          text: "Ты ложишься. Потолок чужой. Мысли не останавливаются — дом, Сергій, что будет, когда закончится. Под утро — всё-таки провал в сон."
          effects: { set_flags: [voyna_arrived], fatigue: -10, stress: 3 }
          leads_to: "первая ночь пережита"
  fallback: { text: "Первый вечер. Соня спит. Что делаешь?", reopen: true }

# ---------- ДЕНЬ 2: чат Оксаны ----------
- id: voyna_oksana_chat
  title: "Волонтёрський чат"
  category: arc
  act: 1
  priority: 90
  once: true
  trigger: scheduled
  day: 2
  entry: { all: [ {flag: voyna_arrived}, {flag_not: knows_oksana} ] }
  stakes: low
  location: plattenbau_flat
  targets: [npc_oksana]
  facts:
    - "В телефоне — приглашение в чат украинских переселенцев Берлина. 847 участников. Пишут по-украински и по-русски."
    - "Оксана, координаторка: 'Всі нові — пишіть у закріп, там всі відповіді по §24 та Jobcenter.' (Все новые — пишите в закреп, там все ответы по §24 и Jobcenter.)"
    - "В чате: где сдать документы, где дешевле продукты, где школа для Сони, где психолог."
  intro: "ОКСАНА (чат): «Ласкаво просимо. (Добро пожаловать.) Ти нова? Напиши, звідки, скільки дітей — допоможемо.»"
  branches:
    - id: write_back
      match: { verbs: [talk, ask_help, apply] }
      outcomes:
        - on: always
          text: "Ты пишешь: откуда, Соня, §24. За десять минут — три ответа с конкретными адресами. Оксана: 'Завтра о 10 ми зустрічаємося біля Jobcenter. Приходь.' (Завтра в 10 встречаемся у Jobcenter. Приходи.)"
          effects: { set_flags: [knows_oksana, jobcenter_meeting_set] }
          deltas: { A: 1 }
          leads_to: "завтра N1 — Jobcenter с Оксаной"
    - id: read_only
      match: { verbs: [observe, inspect_self] }
      outcomes:
        - on: always
          text: "Ты листаешь, не пишешь. Чужие имена, чужие адреса. Полезно. Но писать незнакомым про себя — пока не можешь."
          effects: { set_flags: [knows_oksana_passively] }
          leads_to: "Оксана появится позже (N4) — сигнал к выбору: открыться или замкнуться"
    - id: leave_chat
      match: { verbs: [refuse, move] }
      outcomes:
        - on: always
          text: "Ты выходишь из чата. Незнакомые люди, их проблемы. Разберёшься сама — ты привыкла."
          effects: { leaning: { bubble: 1 } }
          deltas: { P: 1 }
          leads_to: "путь одиночки; N4 — развилка замкнуться vs открыться"
  fallback: { text: "Телефон со ссылкой на чат лежит перед тобой.", reopen: true }

# ---------- ДЕНЬ 3: N1 — Jobcenter ----------
- id: voyna_node_jobcenter
  title: "Jobcenter"
  category: dilemma
  act: 1
  node: N1
  priority: 88
  once: true
  trigger: scheduled
  day: 3
  entry: { all: [ {flag: voyna_arrived}, {flag_not: voyna_n1_done} ] }
  stakes: medium
  location: jobcenter
  targets: [npc_jobcenter_berater]
  facts:
    - "Jobcenter Neukölln. Зал ожидания, номерки. §24 даёт прямой доступ к Bürgergeld — это законно и без очереди на месяцы."
    - "Пан Мюллер: нужны паспорт, §24-Bescheid, Meldeadresse. Bürgergeld ~450 € на взрослого + ~250 € на ребёнка."
    - "Это не подачка — это право, закреплённое законом. Но в очереди стоять тяжело, когда дома ты обеспечивала семью сама."
  intro: "ПАН МЮЛЛЕР: «Guten Morgen. Haben Sie den §24-Bescheid mitgebracht? (Доброе утро. Вы принесли документ о §24?)»"
  branches:
    - id: submit_docs_calm
      match: { verbs: [submit_docs, apply, talk], honesty: [truthful], tone: [polite, neutral] }
      outcomes:
        - on: always
          text: "Документы на месте. Мюллер методично сверяет бумаги, ставит галочки. «Alles in Ordnung. (Всё в порядке.) Erste Zahlung in zwei Wochen.» Выходишь из кабинета: сделала. И почему-то стыдно — хотя не должно быть."
          effects: { set_flags: [voyna_n1_done, buergereld_applied], money: 0 }
          deltas: { P: -2, L: 2 }
          skill_xp: { byurokratiya: 5 }
          leads_to: "пособие оформлено — но ось PRIDE задета; первые деньги через 2 недели"
    - id: ask_oksana_help
      match: { verbs: [ask_help, befriend] }
      requires: [ {flag: knows_oksana} ]
      outcomes:
        - on: always
          text: "Оксана стоит рядом, тихо переводит немецкий, подсказывает бланки. Вместе — быстрее. Мюллер привык к таким тандемам. «Готово. Две недели.» Оксана: «Бачиш? Нічого страшного. (Видишь? Ничего страшного.)»"
          effects: { set_flags: [voyna_n1_done, buergereld_applied, oksana_helped_n1] }
          deltas: { A: 1, P: -1, L: 2 }
          skill_xp: { byurokratiya: 4, deutsch: 2 }
          leads_to: "Оксана показала себя как ресурс; доверие растёт"
    - id: demand_more
      match: { verbs: [persuade, threaten], tone: [aggressive] }
      outcomes:
        - on: always
          text: "Ты не понимаешь, почему так медленно. Голос повышается. Мюллер терпеливо повторяет по-немецки. Ничего не меняется — только очередь косится. Потом берёшь себя в руки. Документы всё равно принимают."
          effects: { set_flags: [voyna_n1_done, buergereld_applied], stress: 8, dossier: "нервничала при первом визите (понятно)" }
          deltas: { G: 3, P: 2, L: 1 }
          leads_to: "бюрократия работает медленно, но работает"
    - id: pride_refuse
      match: { verbs: [refuse] }
      requires: [ {axis_gte: {P: 25}} ]
      outcomes:
        - on: always
          text: "Ты разворачиваешься у кабинета. Не сегодня. Не можешь — стоять в очереди за деньгами, которые... Выходишь. Мюллер смотрит вслед без удивления — он видел такое."
          effects: { leaning: { bubble: 1 } }
          deltas: { P: 3 }
          leads_to: "400 € тают; N2 — давление выбора пособие vs работа острее"
  fallback: { text: "Мюллер ждёт ваш §24-Bescheid.", reopen: true }

# ---------- ДЕНЬ 4 ----------
- id: voyna_sonya_school
  title: "Школа для Сони"
  category: arc
  act: 1
  priority: 70
  once: true
  trigger: scheduled
  day: 4
  entry: { all: [ {flag: has_child}, {flag_not: sonya_school_done} ] }
  stakes: low
  location: plattenbau_flat
  facts:
    - "Соне 7 лет. По закону она обязана ходить в школу — и это не проблема, это право. Ближайшая принимает детей §24."
    - "Но Соня плачет утром: «Мама, я не хочу. Я не понимаю немецкий.»"
    - "«Вільгельм-Буш-Шуле» принимает детей-переселенцев и есть класс интеграции."
  intro: "Соня стоит в дверях с портфелем и красными глазами. «Мамо, я боюся.»"
  branches:
    - id: go_together
      match: { verbs: [offer_help, move, talk], tone: [polite, neutral] }
      outcomes:
        - on: always
          text: "Вы идёте вместе. У школы — ещё три мамы с детьми в похожих куртках, с похожими лицами. Учительница говорит медленно, улыбается Соне. Класс маленький. «Komm, dein Platz ist hier. (Иди, твоё место здесь.)» Соня всё равно оглядывается — но входит."
          effects: { set_flags: [sonya_school_done, sonya_in_school], stress: -5 }
          deltas: { A: 2 }
          leads_to: "Соня в школе; новые контакты среди мам-переселенок"
    - id: send_alone
      match: { verbs: [move, work] }
      outcomes:
        - on: always
          text: "Ты проводишь её до угла. «Ты справишься. Ты умная.» Смотришь, как она идёт одна — маленькая спина с большим портфелем. День потом — как через вату."
          effects: { set_flags: [sonya_school_done, sonya_in_school], stress: 8 }
          leads_to: "Соня справляется; но тяжело"
  fallback: { text: "Соня стоит у двери. Во сколько нужно выходить?", reopen: true }

# ---------- ДЕНЬ 5: N2 — пособие vs работа ----------
- id: voyna_node_buergergeld_vs_work
  title: "Пособие или работа"
  category: dilemma
  act: 1
  node: N2
  priority: 82
  once: true
  trigger: scheduled
  day: 5
  entry: { all: [ {flag_not: voyna_n2_done} ] }
  stakes: high
  location: plattenbau_flat
  facts:
    - "§24: можно работать сразу — права есть. Bürgergeld покроет базовое, но 700 € на двоих в Берлине — это туго."
    - "Работа: нужно признание диплома (долго) или найти что-то не по специальности (быстро, но больно по достоинству)."
    - "Оксана в чате: 'Є вакансія в кафе — без мови, з навчанням.' (Есть вакансия в кафе — без языка, с обучением.)"
    - "Дома ты была главным бухгалтером. Это — Берлин."
  intro: "На столе — два листка: распечатка вакансии из чата и бланк на Bürgergeld. Соня в школе. Ты одна с этим выбором."
  branches:
    - id: apply_work_now
      match: { verbs: [apply, work, submit_docs] }
      outcomes:
        - on: always
          text: "Ты звонишь по вакансии из чата. Кафе, мойка посуды, 12 € в час, гибкий график. На другом конце — усталый голос на смеси укр./де. «Когда можешь начать?» — «Завтра». Это не то, чем ты хотела заниматься. Но это ты — выбираешь сама."
          effects: { set_flags: [voyna_n2_done, has_income, works_cafe], leaning: {legal: 1} }
          deltas: { P: -2, A: 1 }
          leads_to: "доход есть, достоинство царапнуто — но ты не пассивна; N6 — фронт vs работа"
    - id: wait_for_proper_job
      match: { verbs: [search, inquire_status, apply] }
      requires: [ {axis_gte: {P: 20}} ]
      outcomes:
        - on: always
          text: "Ты ищешь вакансии по специальности. Бухгалтер, аналитик, финансы. Большинство — «nur Deutsch C1». Одно CV отправлено. Ждать."
          effects: { set_flags: [voyna_n2_done, searching_work_proper], leaning: {legal: 1} }
          deltas: { P: 2 }
          leads_to: "пособие держит пока; ожидание — источник давления; диплом нужно признавать"
    - id: accept_buergereld_only
      match: { verbs: [rest, refuse, observe] }
      outcomes:
        - on: always
          text: "Пока — пособие. Не сейчас с работой. Соня только начала школу, ты сама только начала. Оксана поймёт. Главное — сначала выдохнуть. «Это временно» — говоришь себе. Как и всё остальное тут."
          effects: { set_flags: [voyna_n2_done, on_buergereld_only], leaning: {bubble: 1} }
          deltas: { P: 1 }
          leads_to: "пассивная стратегия; N6 — новость с фронта ударит по этому хрупкому покою"
  fallback: { text: "Листки лежат на столе. Чай остывает.", reopen: true }

# ---------- ДЕНЬ 6 ----------
- id: voyna_call_home_2
  title: "Звонок: он в порядке"
  category: ambient
  act: 1
  priority: 55
  once: true
  trigger: scheduled
  day: 6
  entry: { all: [ {flag: voyna_arrived}, {flag_not: second_call_done} ] }
  stakes: low
  location: plattenbau_flat
  facts:
    - "Сергій пишет в 11 вечера: «Всё нормально. Не звони — могу не смочь ответить в любой момент.»"
    - "«Нормально» — это слово, которое больше не значит то, что значило раньше."
  intro: "Сообщение в 23:14: «Живий. Цілую вас обох. (Живой. Целую вас обоих.)»"
  branches:
    - id: answer_message
      match: { verbs: [talk, give, offer_help] }
      outcomes:
        - on: always
          text: "Ты пишешь: «И мы. Соня спрашивает про тебя каждый день.» Отправляешь. Три точки — он читает. Потом тишина. Ты ждёшь десять минут. Потом кладёшь телефон."
          effects: { set_flags: [second_call_done], stress: -3 }
          leads_to: "связь живая — и каждый раз обрывается"
    - id: just_read
      match: { verbs: [observe, rest] }
      outcomes:
        - on: always
          text: "Ты читаешь. Перечитываешь. Убираешь телефон под подушку."
          effects: { set_flags: [second_call_done], stress: 5 }
          leads_to: "молчание как самозащита"
  fallback: { text: "Три слова на экране.", reopen: true }

# ---------- ДЕНЬ 7: N3 — русскоязычная среда ----------
- id: voyna_node_russian_encounter
  title: "В магазине"
  category: dilemma
  act: 1
  node: N3
  priority: 78
  once: true
  trigger: scheduled
  day: 7
  entry: { all: [ {flag_not: voyna_n3_done} ] }
  stakes: medium
  location: russian_shop
  targets: [npc_irina_sosedka]
  facts:
    - "Русский магазин в Марцане: гречка, квашеная капуста, знакомые пачки. Соня тащит за руку к полке с конфетами."
    - "За соседней тележкой — Ирина, русская, живёт тут 12 лет. Слышит, как ты говоришь с Соней по-украински."
    - "Язык у вас общий. Контекст — совсем разный."
  intro: "ИРИНА: «Украинка? Привет. Я Ирина. Давно тут живёшь? Как ты вообще?»"
  branches:
    - id: open_carefully
      match: { verbs: [talk], honesty: [truthful, half_truth], tone: [polite, neutral] }
      outcomes:
        - on: always
          text: "Вы говорите у холодильника с творогом. Она рассказывает про квартал, где школа получше, где аптека. Аккуратно обходит войну — и ты тоже. Прощаются по-человечески. «Если что — я в соседнем подъезде.»"
          effects: { set_flags: [voyna_n3_done, irina_neutral_contact] }
          deltas: { A: 1 }
          leads_to: "контакт без конфликта — практически полезный; напряжение под поверхностью осталось"
    - id: name_elephant
      match: { verbs: [talk, persuade], honesty: [truthful], tone: [aggressive, neutral] }
      outcomes:
        - on: always
          text: "Ты говоришь напрямую: что там происходит, почему ты здесь, что ты думаешь. Ирина бледнеет немного, отвечает тихо: «Я понимаю. Я против. Но мне тут жить, и я боюсь говорить об этом вслух.» Пауза. Потом она всё равно даёт номер аптеки."
          effects: { set_flags: [voyna_n3_done, irina_honest_talk], stress: 8 }
          deltas: { G: 2, T: 1 }
          leads_to: "честный разговор — тяжело, но не пустой; Ирина не враг"
    - id: cold_polite
      match: { verbs: [refuse, move], tone: [cold, polite] }
      outcomes:
        - on: always
          text: "«Спасибо, всё хорошо» — и обходишь её тележку. Соня не понимает, почему мама не захотела разговаривать. В очереди — неловко стоять рядом."
          effects: { set_flags: [voyna_n3_done] }
          deltas: { P: 1 }
          leads_to: "изоляция — чище, но теснее"
  fallback: { text: "Ирина ждёт, держа пачку творога.", reopen: true }

# ---------- ДЕНЬ 8 ----------
- id: voyna_first_shift
  title: "Первая смена"
  category: arc
  act: 1
  priority: 60
  once: true
  trigger: chain
  entry: { all: [ {flag: works_cafe}, {flag_not: first_shift_done} ] }
  stakes: low
  location: cafe_third_wave
  facts:
    - "Кафе в Кройцберге. Хозяйка — немка лет сорока, говорит медленно и жестами. Коллеги: одна марокканка, один поляк."
    - "Первая смена: гора посуды, запах кофе, ноги к вечеру гудят."
    - "Зарплата — кэш пока, потом официально. Соня у соседки из чата."
  intro: "Хозяйка: «Guten Morgen. Ich bin Petra. Du bist... Oksana schickte dich? (Доброе утро. Я Петра. Тебя прислала Оксана?)»"
  branches:
    - id: work_silent
      match: { verbs: [work, rest, observe] }
      outcomes:
        - on: always
          text: "Ты моешь посуду. Молча. Марокканка показывает, куда ставить. Поляк кивает — без лишних слов. В конце смены Петра кладёт деньги и говорит: «Morgen auch? (Завтра тоже?)» Ты киваешь."
          effects: { set_flags: [first_shift_done], money: 96 }
          deltas: { P: -1 }
          skill_xp: { deutsch: 2 }
          leads_to: "доход; маленький якорь в Берлине"
    - id: try_talk
      match: { verbs: [talk, befriend], tone: [polite, charming] }
