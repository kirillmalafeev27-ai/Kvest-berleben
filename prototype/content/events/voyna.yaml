    - "Не совсем легально. Но быстро."
    - "Это редкий путь для тех, кто закрылся от сети и не оформил пособие."
  intro: "ИРИНА: «Слушай, я знаю одного человека. Он помогает. Быстро. Ну, не совсем официально. Но работает.»"
  branches:
