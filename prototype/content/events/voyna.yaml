# ---------- ДЕНЬ 62: встреча с Андрієм о возвращении ----------
- id: voyna_andriy_return_question
  title: "Андрій: «А ти?»"
  category: arc
  act: 3
  priority: 70
  once: true
  trigger: scheduled
  day: 62
  entry: { all: [ {flag: knows_andriy}, {flag_not: andriy_return_done} ] }
  stakes: medium
  location: hasenheide_park
  targets: [npc_andriy]
  facts:
    - "Андрій говорит: он возвращается. Не потому что надо — потому что не может больше здесь."
    - "«Може, це неправильно. Але я там хочу бути, навіть якщо страшно. (Может, это неправильно. Но я хочу быть там, даже если страшно.)»"
    - "И смотрит на тебя: «А ти?»"
  intro: "АНДРІЙ: «Я вирішив. Повертаюсь у вересні. (Я решил. Возвращаюсь в сентябре.)»"
  branches:
    - id: understand
      match: { verbs: [talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "«Розумію», — говоришь ты. И это правда. И его выбор, и твой вопрос к себе — оба честные. «А ти так і не вирішила?» — «Поки ні.»"
          effects: { set_flags: [andriy_return_done, andriy_chose_return] }
          deltas: { T: 1 }
          leads_to: "зеркало сформулировало вопрос; N9 — ответ"
    - id: try_convince_stay
      match: { verbs: [persuade, talk] }
      outcomes:
        - on: always
          text: "Ты говоришь: там опасно, здесь есть будущее. Андрій слушает. «Можливо. Але це моє рішення. (Возможно. Но это моё решение.)» — «Так», — соглашаешься ты."
          effects: { set_flags: [andriy_return_done, andriy_chose_return] }
          leads_to: "каждый выбирает сам"
  fallback: { text: "Андрій смотрит на тебя и ждёт.", reopen: true }

# ---------- ДЕНЬ 68: возможность нормальной работы ----------
- id: voyna_work_opportunity
  title: "Вакансия от Оксаны"
  category: arc
  act: 3
  priority: 65
  once: true
  trigger: chain
  entry: { all: [ {flag: knows_oksana}, {any_flag: [diploma_process_started, works_cafe]}, {flag_not: real_job_offer_done} ] }
  stakes: high
  location: jobcenter
  targets: [npc_oksana, npc_jobcenter_berater]
  facts:
    - "Через Оксану: немецкая бухгалтерская фирма берёт помощника-бухгалтера на испытательный срок. Немецкий B1 желателен, Deutsch 40+ хватит при хорошем CV."
    - "Зарплата: 2200 € брутто — не сравнить с кафе. Это почти нормальная жизнь."
    - "Нужно: CV на немецком, мотивационное письмо, собеседование."
  intro: "ОКСАНА: «Слухай, є вакансія. Справжня. Для тебе. Треба спробувати. (Слушай, есть вакансия. Настоящая. Для тебя. Надо попробовать.)»"
  branches:
    - id: apply_for_real_job
      match: { verbs: [apply, submit_docs, work] }
      outcomes:
        - on: always
          text: "Ты пишешь CV. Оксана проверяет немецкий, волонтёр-юрист проверяет статус. Собеседование назначено. Готовишься вечерами, пока Соня спит."
          effects: { set_flags: [real_job_offer_done, applying_real_job] }
          deltas: { P: 2, L: 2 }
          skill_xp: { deutsch: 8, byurokratiya: 4 }
          leads_to: "N9 — если нанята: ending_legal; работа по специальности как якорь"
    - id: doubt
      match: { verbs: [refuse, talk], tone: [submissive, neutral] }
      outcomes:
        - on: always
          text: "«Я не готова. Мій німецький... (Мой немецкий...)» Оксана: «Спробуй. Відмовлять — нічого. Погодяться — все міняється. (Попробуй. Откажут — ничего. Согласятся — всё меняется.)» Ты думаешь."
          effects: { set_flags: [real_job_offer_done] }
          deltas: { P: -1 }
          leads_to: "шанс упущен; возможно появится второй — или не появится"
  fallback: { text: "Оксана держит распечатку вакансии.", reopen: true }

# ---------- ДЕНЬ 75: звонок домой — Сергій ----------
- id: voyna_sergiy_call_act3
  title: "Сергій: «Як ви там?»"
  category: arc
  act: 3
  priority: 60
  once: true
  trigger: scheduled
  day: 75
  entry: { all: [ {flag_not: sergiy_act3_call_done} ] }
  stakes: high
  location: plattenbau_flat
  facts:
    - "Сергій звонит сам — неожиданно. Голос чуть теплее, чем обычно."
    - "«Як ви там? Соня як?» Он хочет знать про Берлин."
    - "Ты не знаешь, говорить ли правду: что начинаешь привыкать, что Берлин начинает казаться менее чужим."
  intro: "СЕРГІЙ: «Привіт. Розкажи мені про Берлін. Що там взагалі? (Привет. Расскажи мне про Берлин. Что там вообще?)»"
  branches:
    - id: tell_truth_adapting
      match: { verbs: [talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "«Ми звикаємо. Трохи. Соня вже розуміє по-німецьки. Я теж. Це... страшно, насправді.» Пауза. «Чому страшно?» — «Бо це означає, що ми залишаємось.» Он молчит долго. «Це не погано», — наконец."
          effects: { set_flags: [sergiy_act3_call_done, told_sergiy_adapting] }
          deltas: { T: 2 }
          leads_to: "честный разговор; N9 — возвращение или остаться без лжи"
    - id: reassure_coming_back
      match: { verbs: [talk, deceive], honesty: [half_truth] }
      outcomes:
        - on: always
          text: "«Всё нормально. Ждём, когда вернёмся. Соня спрашивает про папу каждый день.» — «Скоро», — говорит он. Вы оба знаете, что «скоро» — это слово без смысла сейчас."
          effects: { set_flags: [sergiy_act3_call_done, half_truth_sergiy] }
          deltas: { T: -1 }
          leads_to: "полуправда держит; но N9 — вопрос без ответа"
  fallback: { text: "Сергій ждёт.", reopen: true }

# ---------- N9: «Що далі?» — развязка ----------
- id: voyna_node_resolution
  title: "Що далі?"
  category: dilemma
  act: 3
  node: N9
  priority: 95
  once: true
  trigger: scheduled
  day: 85
  entry: { all: [] }
  stakes: extreme
  location: plattenbau_flat
  targets: [npc_oksana]
  facts:
    - "Хозяева возвращаются через месяц. Надо решить: остаться в Берлине и искать постоянное жильё, вернуться домой, или продолжать в «временном» режиме."
    - "§24 продлевается — статус пока есть. Но это решение нельзя откладывать вечно."
    - "Соня говорит по-немецки с акцентом, которого у тебя нет. Она уже здесь."
  intro: "Оксана пришла с чаем. «Ну що — думала? Що далі? (Ну что — думала? Что дальше?)» Не давит. Просто спрашивает."
  branches:
    # Порядок важен: первый подходящий по requires = концовка
    - id: deport
      match: { verbs: [observe, talk, rest, submit_docs, inquire_status, apply, refuse] }
      requires: [ {flag: gray_papers_route}, {leaning_gte: {gray: 4}} ]
      outcomes:
        - on: always
          text: "Серые бумаги дали трещину — проверка выявила несоответствие. Статус отозван. Выезд в течение месяца. Ты пакуешь вещи — снова. Соня плачет. Ты объясняешь ей что-то, в чём сама не уверена. Это не конец истории — это конец этой главы. (КОНЦОВКА: депортация/крах)"
          effects: { set_flags: [ending_deport, game_over] }
          leads_to: "ending_deport"
    - id: ending_legal
      match: { verbs: [apply, submit_docs, work, talk, offer_help] }
      requires: [ {any_flag: [applying_real_job, diploma_process_started]}, {flag: oksana_community_joined}, {skill_gte: {deutsch: 35}} ]
      outcomes:
        - on: always
          text: "Ты получила место в бухгалтерской фирме — или первый шаг к признанию диплома оказался не последним. Соня в школе, ты в работе. Квартиру нашла через чат. Берлин больше не совсем чужой. Дома — война. Сергій — там. Это всё ещё болит. Но ты здесь — не потому что не можешь уехать, а потому что решила. (КОНЦОВКА: укоренение)"
          effects: { set_flags: [ending_legal, game_over] }
          deltas: { P: 2 }
          leads_to: "ending_legal"
    - id: ending_exit
      match: { verbs: [move, talk, refuse, rest] }
      requires: [ {flag: told_sergiy_adapting}, {flag: andriy_chose_return} ]
      outcomes:
        - on: always
          text: "Ты покупаешь билет. Не потому что Берлин плохой. И не потому что проиграла. Потому что Сергій там, потому что дом — это он и твой город, пока они ещё есть. Соня прощается с учительницей по-немецки. «Auf Wiedersehen», — говорит она. Может, до свидания. Может, навсегда. (КОНЦОВКА: возвращение)"
          effects: { set_flags: [ending_exit, game_over] }
          deltas: { P: 2 }
          leads_to: "ending_exit — НЕ поражение, это выбор"
    - id: ending_underground
      match: { verbs: [hide, flee, observe, rest] }
      requires: [ {flag: gray_papers_route}, {leaning_gte: {gray: 3}} ]
      outcomes:
        - on: always
          text: "Статус истёк тихо. Ты нашла способ оставаться — серые бумаги, серые схемы. Живёшь. Работаешь вчёрную. Соня в школе на чужой фамилии. Каждый день — держать. Это не жизнь, которую ты хотела. Но ты выжила, и это что-то значит. (КОНЦОВКА: серое подполье)"
          effects: { set_flags: [ending_underground, game_over] }
          leads_to: "ending_underground"
    - id: ending_gray
      match: { verbs: [rest, observe, talk] }
      requires: [ {flag: buergereld_applied} ]
      outcomes:
        - on: always
          text: "Статус продлён. Пособие идёт. Соня в школе. Ты живёшь — но ещё «временно». Год. Потом ещё год. «Это временно» стало образом жизни. Ни здесь, ни там. Берлин знаком, но не свой. Дома — далеко. Зависание длится. (КОНЦОВКА: серое зависание)"
          effects: { set_flags: [ending_gray, game_over] }
          leads_to: "ending_gray"
    - id: ending_gray_default
      match: { verbs: [observe, talk, rest, submit_docs, inquire_status, apply, move, refuse] }
      outcomes:
        - on: always
          text: "Ничего не решилось окончательно. Статус есть — на год ещё. Ты в середине: и не уезжаешь, и не укореняешься. «Подивимось», — говоришь ты Оксані. Она кивает: она знает это состояние. (КОНЦОВКА: серое зависание)"
          effects: { set_flags: [ending_gray, game_over] }
          leads_to: "ending_gray"
  fallback: { text: "Оксана ждёт. Чай стынет.", reopen: true }
