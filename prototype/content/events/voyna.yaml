    - "На встрече у Оксаны появляется Катя — три дня как приехала из Запорожья. Муж там. Дочь 5 лет."
    - "Смотрит на тебя — как ты смотрела на других месяц назад."
    - "Оксана тихо: «Поговори з нею. Ти вже знаєш більше, ніж думаєш. (Поговори с ней. Ты уже знаешь больше, чем думаешь.)»"
  intro: "КАТЯ: «Вибачте... ви вже давно тут? Як ви взагалі... почали? (Извините... вы уже давно здесь? Как вы вообще... начали?)»"
  branches:
    - id: help_with_warmth
      match: { verbs: [offer_help, talk, befriend], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты говоришь ей про Jobcenter, про школу, про чат. И про то, что первые недели — это просто выжить, и это нормально. Катя слушает так, как ты слушала бы. Оксана кивает через стол."
          effects: { set_flags: [voyna_n8_done, mirror_helped_newcomer], faction: {ukrainian_volunteers: 8} }
          deltas: { A: 3 }
          leads_to: "красит финал: круг замкнулся; Оксана-типаж передаётся дальше"
    - id: give_practical_info
      match: { verbs: [talk, give], tone: [neutral, cold] }
      outcomes:
        - on: always
          text: "Адреса, сайты, номера. Ты даёшь список — без лишних слов. Катя записывает. Это тоже помощь."
          effects: { set_flags: [voyna_n8_done, mirror_practical] }
          deltas: { A: 1 }
          leads_to: "практичная передача знаний"
    - id: too_much
      match: { verbs: [refuse, rest] }
      outcomes:
        - on: always
          text: "«Простіть, у мене зараз не виходить. (Простите, у меня сейчас не получается.)» Ты уходишь раньше. Оксана понимает — ты тоже ещё в процессе."
          effects: { set_flags: [voyna_n8_done, mirror_couldnt] }
          deltas: { P: 1 }
          leads_to: "не хватило сил; это честно"
  fallback: { text: "Катя смотрит и ждёт.", reopen: true }

# ---------- ДЕНЬ 45: немецкий ----------
