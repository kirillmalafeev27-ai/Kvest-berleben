    - id: want_to_stay_gray
      match: { verbs: [talk, work], honesty: [half_truth] }
      outcomes:
        - on: always
          text: "«Хочу остаться. Как получится.» Хоа молчит минуту. «Ладно, con. Тогда держись рядом. Мы своих не бросаем.»"
          effects: { set_flags: [hoa_final_done, hoa_keeps_you_close] }
          leaning: { gray: 1 }
          leads_to: "Хоа держит рядом — серый цикл"
    - id: want_to_go_home
      match: { verbs: [refuse, rest], honesty: [truthful] }
      outcomes:
        - on: always
          text: "«Устал. Думаю уехать.» Хоа кладёт руку на твою. «Это не слабость, con. Это честность.» Впервые с приезда кто-то сказал это."
          effects: { set_flags: [hoa_final_done, hoa_exit_blessing] }
          deltas: { P: 2, A: 1 }
          leads_to: "Хоа благословляет выход — ending_exit усилен"
  fallback: { text: "Хоа ждёт.", reopen: true }

# ---------- ДЕНЬ 70: Вэй — финальная сцена перед N9 ----------
- id: student_wei_final
  title: "Вэй. Ночь перед решением"
  category: arc
  act: 3
  priority: 70
  once: true
  trigger: chain
  entry: { all: [ {flag: met_wei}, {day_gte: 65}, {flag_not: wei_final_done} ] }
  stakes: medium
  location: plattenbau_flat
  targets: [npc_wei]
  facts:
    - "Вэй получил продление. Он сдал. Ты ещё нет."
    - "Это момент, когда зеркало говорит сам."
  intro: "ВЭЙ: «Ты читал своё письмо из деканата?» Он знает. Он всегда знает чуть раньше."
  branches:
    - id: admit_struggle
      match: { verbs: [talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "«Да. Пограничная ситуация.» Вэй молчит. «Я тоже был там. Первый семестр.» Пауза. «У тебя осталось время. Только не говори, что всё хорошо — ни себе, ни домой.»"
          effects: { set_flags: [wei_final_done, wei_final_solidarity] }
          deltas: { A: 1 }
          leads_to: "Вэй на стороне честного пути"
    - id: pretend_fine
      match: { verbs: [talk], honesty: [lie, half_truth] }
      outcomes:
        - on: always
          text: "«Нормально. Справлюсь.» Вэй смотрит. Не верит. «Ладно.» Он уходит. Вы оба знаете, что это ложь. И что это привычка."
          effects: { set_flags: [wei_final_done] }
          deltas: { T: -1 }
          leads_to: "зеркало не помогло — каждый сам"
  fallback: { text: "Вэй ждёт.", reopen: true }

