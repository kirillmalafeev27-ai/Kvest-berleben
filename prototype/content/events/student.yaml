  facts:
    - "Разговоры вокруг — быстрый берлинский немецкий. Ты понимаешь слова, но не смысл. Или наоборот."
    - "Это называется языковая изоляция — и это нормально, но от этого не легче."
  intro: "На улице кто-то что-то говорит в твою сторону. Комплимент? Жалоба? Просьба?"
