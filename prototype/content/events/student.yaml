#  N9 — РАЗВЯЗКА (день 73)
# ════════════════════════════════════════════════════════════

- id: student_node_n9_resolve
  title: "Письмо из Ausländerbehörde"
  category: dilemma
  act: 3
  node: N9
  priority: 98
  once: true
  trigger: scheduled
  day: 73
  entry: { all: [] }
  stakes: extreme
  location: auslaenderbehoerde
  targets: [npc_studienbuero]
  facts:
    - "Пришло официальное письмо. В деле — академический прогресс, состояние Sperrkonto, рабочие часы, нарушения (если есть)."
    - "Это последняя точка. То, что накоплено за 73 дня, определяет исход."
  intro: "Конверт. Штамп Ausländerbehörde. Ты вскрываешь его — медленно, как будто это поможет."
  branches:
    # Порядок ВАЖЕН. Первый подходящий по requires = концовка.

    # ① ДЕПОРТАЦИЯ — нарушение визовых условий задокументировано
    - id: ending_deport_academic
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, apply, talk, give, rest, refuse] }
      requires: [ {flag: academic_failed_final} ]
      outcomes:
        - on: always
          text: "«Akademische Voraussetzungen nicht erfüllt.» (Академические требования не выполнены.) Отказ в продлении. Виза истекает через 30 дней. Краузе говорит это без злости — он видел многих. Не конец — просто не эта история, не в этот раз. (КОНЦОВКА: депортация — академика)"
          effects: { set_flags: [ending_deport, game_over] }
          dossier: "отказ в продлении: недостаточный академический прогресс"
          leads_to: "ending_deport"

    # ② ДЕПОРТАЦИЯ — пойман на нелегальной работе
    - id: ending_deport_work
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, apply, talk, give, rest, refuse] }
      requires: [ {flag: caught_working_gray} ]
      outcomes:
        - on: always
          text: "В деле — пометка Zoll: «задержан при нелегальной работе». Страховка не сработала. Визу не продлевают. Хоа узнает — и промолчит. Ты знаешь, что она думает. (КОНЦОВКА: депортация — нарушение условий)"
          effects: { set_flags: [ending_deport, game_over] }
          dossier: "отказ в продлении: нарушение условий занятости"
          leads_to: "ending_deport"

    # ③ ВИЗА ВЫПУСКНИКА / ЛЕГАЛЬНЫЙ ПУТЬ
    - id: ending_legal_graduate
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, apply, talk, give, rest] }
      requires:
        - { flag: academic_passed }
        - { flag: sperrkonto_warned }
        - { flag_not: caught_working_gray }
        - { flag_not: academic_failed_final }
      outcomes:
        - on: always
          text: "Виза продлена. «Akademisch erfolgreich. Finanzielle Grundlage nachgewiesen.» (Академически успешно. Финансовое обеспечение подтверждено.) Ты сдал. Оба счётчика — зелёные. Это не торжество — это выдох. Где-то дома мама ещё не знает. Ты сядешь и напишешь правду. Впервые. (КОНЦОВКА: легализация — виза выпускника)"
          effects: { set_flags: [ending_legal, game_over] }
          deltas: { P: 2 }
          leads_to: "ending_legal"

    # ④ ПОДПОЛЬЕ — систематический серый, ушёл из системы
    - id: ending_underground_gray
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, apply, talk, give, rest, refuse] }
      requires: [ {leaning_gte: {gray: 6}}, {flag: hoa_deep_gray} ]
      outcomes:
        - on: always
          text: "Ты давно перестал считать дни визы — потому что перестал рассчитывать на систему. Dong Xuan держит. Хоа держит. Вэй... Вэй ушёл в законный путь, не сказав тебе. Ты остаёшься — в тени, без бумаг, среди своих. Можно. Но однажды тень перестаёт быть выбором. (КОНЦОВКА: подполье)"
          effects: { set_flags: [ending_underground, game_over] }
          leads_to: "ending_underground"

    # ⑤ СЕРЫЙ ЦИКЛ — бесконечный студенческий статус
    - id: ending_gray_cycle
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, apply, talk, give, rest, refuse] }
      requires: [ {flag: academic_borderline}, {flag_not: caught_working_gray} ]
      outcomes:
        - on: always
          text: "Краузе говорит: ещё один семестр. Условно. Продление — не подтверждение, а отсрочка. Ты остаёшься в серой зоне: студент, но почти нет; работник, но по лимиту; дома — «всё нормально». Это не провал — это петля. (КОНЦОВКА: серая стабильность)"
          effects: { set_flags: [ending_gray, game_over] }
          leads_to: "ending_gray"

    # ⑥ ВЫХОД С ДОСТОИНСТВОМ
    - id: ending_exit_dignity
      match: { verbs: [refuse, observe, inspect_self, talk, rest] }
      requires: [ {axis_gte: {P: 30}}, {flag: hoa_exit_blessing} ]
      outcomes:
        - on: always
          text: "Ты уходишь раньше, чем письмо решит за тебя. Покупаешь билет. Берлин смотрит вслед — не злобно, просто никак. Ты позвонишь домой из аэропорта и скажешь правду — о деньгах, об усталости, о том, что это не поражение. Хоа отдала долг назад — ты отказался. «Возьми, con. Ты заработал — честно.» (КОНЦОВКА: выход с достоинством)"
          effects: { set_flags: [ending_exit, game_over] }
          deltas: { P: 2 }
          leads_to: "ending_exit"

    # ФОЛЛБЭК — серая стабильность по умолчанию
    - id: ending_gray_default
      match: { verbs: [observe, inspect_self, submit_docs, inquire_status, apply, talk, give, rest, refuse] }
      outcomes:
        - on: always
          text: "Ни да, ни нет. Продление — условное. Ты остаёшься — в подвешенном «пока что». Это не конец, это середина без конца. (КОНЦОВКА: серая стабильность)"
          effects: { set_flags: [ending_gray, game_over] }
          leads_to: "ending_gray"

  fallback: { text: "Конверт в руках. Вскрой его.", reopen: true }

