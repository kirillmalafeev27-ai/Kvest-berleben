# События линии «Студент», Акт I–III.
# Канон: design/02_magistralnye_linii.md §2.4; NPC: design/09_personazhi.md §Vietnamese/Chinese.
# Стартовые данные (economy.yaml lines.student):
#   money 900, visa_days 75 (clock_label "Sperrkonto/учёба"), deutsch 25,
#   flags [has_laptop, work_limit], location plattenbau_flat.
# Двойной счётчик давления: деньги Sperrkonto тают (~934/мес) + нужно показывать академпрогресс.
# Работа ограничена 120/240 дней в году — превышение бьёт по визе.
# Уникальный хаб: dong_xuan (вьетнамский рынок, тётушка Хоа, серый заработок).
# Тон (design/08): изоляция с достоинством; вьетнамский/китайский/немецкий вкрапления с переводом.

events:

# ════════════════════════════════════════════════════════════
#  АКТ I  (дни 1–20)
# ════════════════════════════════════════════════════════════

# ---------- ДЕНЬ 1: прибытие ----------
- id: student_arrival
  title: "Первый вечер"
  category: arc
  act: 1
  priority: 100
  once: true
  trigger: scheduled
  day: 1
  entry: { all: [ {flag_not: student_arrived} ] }
  stakes: trivial
  location: plattenbau_flat
  facts:
    - "Ты — китаец или вьетнамец, около 21 года, студенческая виза. Берлин. Plattenbau на окраине."
    - "При тебе: ноутбук, 900 € (Sperrkonto отдаёт по ~934/мес, но банк проверяет остаток), Work Permit на 120 дней в году."
    - "Соседи по комнате — двое незнакомых. Немецкий у тебя — A2, примерно. Университет завтра."
    - "Родители перевели всё что могли. Mẹ сказала: «Con phải cố lên.» (Ты должен стараться, дитя.)"
  intro: "Чемодан у кровати. Соседи молчат. Телефон показывает: 22:47. За окном — плоские крыши."
  branches:
    - id: unpack
      match: { verbs: [observe, inspect_self, search, rest] }
      outcomes:
        - on: always
          text: "Ты разбираешь вещи. На дне сумки — конверт с семейной фотографией и листок с суммами: сколько уже потрачено, сколько осталось. Цифры давят."
          effects: { set_flags: [student_arrived], stress: 5 }
          leads_to: "завтра — первый день в универе (N1)"
    - id: call_home
      match: { verbs: [talk, ask_help] }
      outcomes:
        - on: always
          text: "Ты звонишь домой. Мама переспрашивает трижды — связь плохая. «Хорошо? Ешь?» — «Хорошо, мама. Всё хорошо.» Ты не говоришь, что ещё не ел с самолёта."
          effects: { set_flags: [student_arrived], stress: -5 }
          deltas: { P: 1 }
          leads_to: "завтра — первый день в универе (N1)"
  fallback: { text: "Чемодан сам себя не разберёт. Что делаешь?", reopen: true }

# ---------- ДЕНЬ 2: N1 — регистрация / первый контакт с системой ----------
- id: student_node_n1_uni
  title: "Studienkolleg. Первый день"
  category: dilemma
  act: 1
  node: N1
  priority: 92
  once: true
  trigger: scheduled
  day: 2
  entry: { all: [ {flag: student_arrived}, {flag_not: student_n1_done} ] }
  stakes: medium
  location: auslaenderbehoerde
  targets: [npc_studienbuero]
  facts:
    - "Студенческий деканат. Г-н Краузе объясняет правила: отчётность об успеваемости каждые 2 семестра."
    - "Минимальный балл — иначе потеря статуса «студент» и виза не продлевается."
    - "Работа: не более 120 дней полной занятости (или 240 половинных) в году. «Превышение — это нарушение визового условия.»"
    - "Sperrkonto: банк проверяет, что сумма выше порога. Если тратишь слишком быстро — проблема."
  intro: "Г-Н КРАУЗЕ: «Laut Prüfungsordnung, Sie müssen mindestens... (По правилам экзаменационного регламента, вы обязаны...)» Он говорит быстро. Немецкий плывёт."
  branches:
    - id: listen_carefully
      match: { verbs: [observe, inquire_status, ask_help], honesty: [truthful] }
      skill_check: { skill: deutsch, vs: 28 }
      outcomes:
        - on: success
          text: "Ты уловил главное: два счётчика давления — деньги и оценки. Краузе замечает, что ты слушаешь, и чуть замедляется."
          effects: { set_flags: [student_n1_done, understands_double_pressure], inc: { study_progress: 1 } }
          deltas: { L: 1 }
          skill_xp: { deutsch: 4, byurokratiya: 3 }
          leads_to: "N2 — стратегия выживания"
        - on: fail
          text: "Поток немецкого слипается в единую стену звуков. Ты кивал. Главное ты понял потом — из листовки, которую дали на выходе."
          effects: { set_flags: [student_n1_done], stress: 8 }
          skill_xp: { deutsch: 2 }
          leads_to: "N2 — без чёткого понимания правил (риск)"
    - id: ask_chinese
      match: { verbs: [ask_help, talk, befriend] }
      outcomes:
        - on: always
          text: "У выхода — другой студент, китаец. Он объясняет по-китайски: «两个压力。学习和钱。» (Два давления. Учёба и деньги.) Его зовут Вэй."
          effects: { set_flags: [student_n1_done, met_wei], stress: -5 }
          deltas: { A: 1 }
          skill_xp: { deutsch: 1 }
          followups: [student_wei_first_talk]
          leads_to: "знакомство с Вэй (N5-семя)"
    - id: submit_forms_quiet
      match: { verbs: [submit_docs, apply, book_appointment] }
      outcomes:
        - on: always
          text: "Ты молча сдаёшь формы. Краузе ставит штамп. «Willkommen an der Hochschule.» Ты выходишь на холодный берлинский воздух."
          effects: { set_flags: [student_n1_done], inc: { study_progress: 1 } }
          skill_xp: { byurokratiya: 2 }
          leads_to: "N2 — стратегия выживания"
  fallback: { text: "Краузе смотрит поверх бумаг.", reopen: true }

# ---------- Цепочка: первый разговор с Вэй ----------
- id: student_wei_first_talk
  title: "一样的压力 (Одинаковое давление)"
  category: arc
  act: 1
  priority: 80
  once: true
  trigger: chain
  entry: { all: [ {flag: met_wei}, {flag_not: wei_talk1_done} ] }
  stakes: low
  location: plattenbau_flat
  targets: [npc_wei]
  facts:
    - "Вэй живёт в соседнем блоке. Второй семестр. Знает Берлин лучше."
    - "Его родители тоже ждут. «Родители не знают» — его любимая фраза."
  intro: "ВЭЙ: «У тебя часы посчитаны? У меня — восемьдесят три из ста двадцати. Мне хватит до января.»"
  branches:
    - id: honest_pressure
      match: { verbs: [talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты говоришь честно: денег меньше, чем казалось. Вэй кивает: «Все так говорят в первый месяц. Потом привыкаешь — или ломаешься.» Он не улыбается."
          effects: { set_flags: [wei_talk1_done, wei_knows_pressure], inc: { wei_trust: 1 } }
          deltas: { A: 1 }
          leads_to: "Вэй — будущее зеркало N5"
    - id: save_face
      match: { verbs: [talk], honesty: [half_truth, lie] }
      outcomes:
        - on: always
          text: "«Нормально», — говоришь ты. Вэй смотрит на тебя секунду дольше нормального. «Ладно», — произносит он наконец."
          effects: { set_flags: [wei_talk1_done], deltas: {T: -1} }
          leads_to: "Вэй видит маску — это аукнется"
  fallback: { text: "Вэй ждёт ответа.", reopen: true }

# ---------- ДЕНЬ 5: N2 — как выживать (учёба vs подработка) ----------
- id: student_node_n2_survival
  title: "Как выжить здесь"
  category: dilemma
  act: 1
  node: N2
  priority: 88
  once: true
  trigger: scheduled
  day: 5
  entry: { all: [ {flag: student_n1_done}, {flag_not: student_n2_done} ] }
  stakes: high
  location: plattenbau_flat
  facts:
    - "900 € осталось. Ежемесячный минимум — ~650 € (жильё + еда). Sperrkonto отдаёт порциями."
    - "Легальная работа: до 120 дней в году. Сейчас конец октября — уже потрачено 0 дней."
    - "Вариант А: найти легальную подработку (медленно, но чисто, ест рабочие дни)."
    - "Вариант Б: Dong Xuan — тётушка Хоа берёт помогать в нейл-салоне, кэш, неофициально."
    - "Вариант В: учиться изо всех сил, просить родных прислать ещё."
  intro: "Ты закрываешь таблицу расходов. Цифры не сходятся. Нужно решение."
  branches:
    - id: legal_work_search
      match: { verbs: [apply, search, work], methods: [through_institution] }
      outcomes:
        - on: always
          text: "Ты ищешь легальную работу через студенческий портал: кампусная библиотека, кофейня, промо. Не быстро, но чисто. Каждый рабочий день — минус из лимита 120."
          effects: { set_flags: [student_n2_done, legal_work_path], leaning: { legal: 2 }, inc: { work_days_used: 0 } }
          deltas: { L: 2 }
          skill_xp: { byurokratiya: 2 }
          leads_to: "белый путь — медленно, зато N6-риск минимален"
    - id: dong_xuan_hoa
      match: { verbs: [ask_help, work, move, trade] }
      outcomes:
        - on: always
          text: "Ты едешь в Dong Xuan. В глубине рынка — нейл-салон с вывеской на вьетнамском. Тётушка Хоа оглядывает тебя: «Con người Việt không? (Ты вьетнамец?)» Ты объясняешь ситуацию. Она молчит минуту. «Làm đi con. Три дня в неделю. Кэш. Я ничего не слышала.»"
          effects: { set_flags: [student_n2_done, hoa_work_gray, knows_hoa], leaning: { gray: 2 } }
          deltas: { L: -2 }
          leads_to: "серый путь у Хоа — деньги есть, виза под угрозой"
    - id: ask_parents
      match: { verbs: [ask_help, beg, talk], methods: [by_phone] }
      requires: [ {axis_gte: {P: 0}} ]
      outcomes:
        - on: always
          text: "Ты звонишь домой и после долгого молчания говоришь, что деньги кончаются. Пауза. «Con cần bao nhiêu? (Сколько тебе нужно, дитя?)» — голос матери. Стыд и облегчение одновременно."
          effects: { set_flags: [student_n2_done, asked_parents], money: 300, stress: 15 }
          deltas: { P: -3, A: 1 }
          leads_to: "деньги есть, но долг перед родителями растёт"
    - id: study_only
      match: { verbs: [rest, refuse, observe] }
      requires: [ {flag: understands_double_pressure} ]
      outcomes:
        - on: always
          text: "«Сначала учёба.» Ты закрываешь вкладку с объявлениями. Деньги закончатся быстрее — зато рабочие дни не горят, и Краузе не придерётся к прогрессу."
          effects: { set_flags: [student_n2_done, study_first_path], leaning: { legal: 1 }, stress: 8 }
          deltas: { P: 2, L: 1 }
          leads_to: "чистый путь под максимальным финансовым давлением"
  fallback: { text: "Таблица расходов открыта. Ответа нет — только выбор.", reopen: true }

# ---------- Рабочие смены у Хоа (повторяемые) ----------
- id: student_hoa_shift
  title: "Смена в нейл-салоне"
  category: arc
  act: 1
  priority: 50
  trigger: pool
  weight: 2.0
  cooldown_days: 2
  entry: { all: [ {flag: hoa_work_gray} ], none: [ {flag: student_work_limit_hit} ] }
  stakes: low
  location: dong_xuan
  targets: [npc_chi_hoa]
  facts:
    - "Dong Xuan Market. Запах лаков, вьетнамское радио, чай без просьбы."
    - "Тётушка Хоа работает молча и ловко. Клиенты — свои, вьетнамцы и немцы."
  intro: "ХОА: «Con đến rồi. (Пришёл, дитя.) Бокс третий, клиентка ждёт.»"
  branches:
    - id: work_quietly
      match: { verbs: [work, offer_help] }
      skill_check: { skill: trud, vs: 25 }
      outcomes:
        - on: success
          text: "Три часа. Ты устал, но Хоа кладёт деньги без слов. Ты понимаешь: здесь платят за молчание так же, как за руки."
          effects: { money: 45, fatigue: 12, inc: { hoa_shifts: 1, gray_work_days: 1 } }
          deltas: { L: -1 }
          skill_xp: { trud: 4 }
          leads_to: "деньги есть; рабочие дни в серую зону растут"
        - on: fail
          text: "Хоа смотрит на твои руки недовольно. «Уйди, отдохни.» Платит, но меньше."
          effects: { money: 20, fatigue: 8, inc: { hoa_shifts: 1, gray_work_days: 1 } }
          skill_xp: { trud: 2 }
    - id: ask_hoa_community
      match: { verbs: [talk, ask_help, inquire_status] }
      outcomes:
        - on: always
          text: "Ты пробуешь разговориться. Хоа отвечает коротко. Но ты узнаёшь: Dong Xuan — не просто рынок. Здесь земляки помогают друг другу. И следят друг за другом."
          effects: { money: 45, fatigue: 10, inc: { hoa_shifts: 1, gray_work_days: 1 }, faction: { vietnamese: 3 } }
          deltas: { A: 1 }
          leads_to: "понимание общины — полезно на N4 и N8"
  fallback: { text: "Хоа кивает на свободный бокс.", reopen: true }

# ---------- Легальные смены (повторяемые) ----------
- id: student_legal_shift
  title: "Смена в кампусной кофейне"
  category: arc
  act: 1
  priority: 48
  trigger: pool
  weight: 2.0
  cooldown_days: 2
  entry: { all: [ {flag: legal_work_path} ] }
  stakes: low
  location: cafe_third_wave
  facts:
    - "Студенческая кофейня. Медленно, немецкий нужен, платят меньше чем у Хоа."
    - "Зато — официально. Рабочие дни уходят из лимита 120/год."
  intro: "Смена началась. Очередь немцев — и их быстрый немецкий."
  branches:
    - id: work_legal
      match: { verbs: [work, talk, offer_help] }
      skill_check: { skill: deutsch, vs: 30 }
      outcomes:
        - on: success
          text: "Заказы, кассир, «danke schön» — четыре часа. Немецкий растёт по чуть-чуть, а оплата — официально на счёт."
          effects: { money: 35, fatigue: 14, inc: { work_days_used: 1 } }
          skill_xp: { deutsch: 3, trud: 2 }
          leads_to: "лимит дней уходит, но чисто"
        - on: fail
          text: "Перепутал заказ, немецкий подвёл. Ничего страшного. Деньги пришли. Словарный запас += 5 слов."
          effects: { money: 35, fatigue: 10, stress: 5, inc: { work_days_used: 1 } }
          skill_xp: { deutsch: 4 }
  fallback: { text: "Очередь не ждёт.", reopen: true }

# ---------- ДЕНЬ 9: N3 — академический провал/пересдача ----------
- id: student_node_n3_exam_fail
  title: "Bewertung: nicht bestanden"
  category: dilemma
  act: 1
  node: N3
  priority: 82
  once: true
  trigger: scheduled
  day: 9
  entry: { all: [ {flag: student_n2_done}, {flag_not: student_n3_done} ] }
  stakes: high
  location: auslaenderbehoerde
  targets: [npc_studienbuero]
  facts:
    - "Первый зачёт провален. Краузе объясняет: пересдача через три недели. Второй провал — пересмотр статуса."
    - "Сочетание с нехваткой денег и работой создаёт тиски: больше работаешь — меньше учишься — риск визе."
  intro: "Г-Н КРАУЗЕ: «Nicht bestanden. (Не сдано.) Wiederholen Sie in drei Wochen. Das ist Ihre Chance.» (Повторите через три недели. Это ваш шанс.)"
  branches:
    - id: study_hard_apologize
      match: { verbs: [apologize, apply, submit_docs], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты честно говоришь: трудно, перегруз, но ты справится. Краузе кивает без сочувствия: «Ich hoffe es.» (Надеюсь.) Три недели — или всё."
          effects: { set_flags: [student_n3_done, has_resit, told_krauzze_truth], stress: 15 }
          deltas: { T: 1, L: 1 }
          skill_xp: { deutsch: 2 }
          leads_to: "три недели на подготовку — давление максимально"
    - id: blame_system
      match: { verbs: [threaten, talk], tone: [aggressive] }
      outcomes:
        - on: always
          text: "Ты жалуешься, что система не адаптирована. Краузе делает пометку. «Bitte ruhig bleiben. (Пожалуйста, успокойтесь.)» Слова правильные — форма не помогла."
          effects: { set_flags: [student_n3_done, has_resit, krauzze_notes_trouble], stress: 10 }
          deltas: { G: 3, T: -1 }
          dossier: "конфликт с деканатом на первом месяце"
          leads_to: "зерно недоверия в деле"
    - id: ask_wei_help
      match: { verbs: [ask_help, befriend], honesty: [truthful] }
      requires: [ {flag: met_wei} ]
      outcomes:
        - on: always
          text: "Ты говоришь Вэю. Он достаёт старые конспекты: «Вот билеты. Я сам по ним сдавал.» Впервые с приезда — кто-то просто помог, без цены."
          effects: { set_flags: [student_n3_done, has_resit, wei_gave_notes], inc: { wei_trust: 1 }, stress: -8 }
          deltas: { A: 2 }
          followups: [student_wei_solidarity]
          leads_to: "N5-семя Вэй углубляется"
    - id: reduce_work_for_study
      match: { verbs: [refuse, rest] }
      requires: [ {any_flag: [hoa_work_gray, legal_work_path]} ]
      outcomes:
        - on: always
          text: "Ты сокращаешь смены. Хоа или кофейня — меньше денег, зато можно открыть книги. Выбор болезненный, но он твой."
          effects: { set_flags: [student_n3_done, has_resit, reduced_work_for_study], stress: 5 }
          deltas: { P: 2, L: 1 }
          leads_to: "деньги падают; шанс на пересдачу растёт"
  fallback: { text: "Краузе ждёт твоей реакции.", reopen: true }

# ---------- Цепочка: пересдача (через 3 недели после N3) ----------
- id: student_resit_exam
  title: "Пересдача"
  category: arc
  act: 1
  priority: 78
  once: true
  trigger: chain
  entry: { all: [ {flag: has_resit}, {day_gte: 22}, {flag_not: resit_done} ] }
  stakes: high
  location: auslaenderbehoerde
  targets: [npc_studienbuero]
  facts:
    - "Пересдача. Последний шанс в этом семестре."
  intro: "Аудитория. Краузе раздаёт листы. Ты слышишь шелест — и своё дыхание."
  branches:
    - id: pass_resit
      match: { verbs: [work, rest, apply] }
      skill_check: { skill: deutsch, vs: 35, plus: { byurokratiya: 0.3 } }
      outcomes:
        - on: success
          text: "«Bestanden.» (Сдано.) Краузе ставит галочку. Ты выходишь на улицу — и несколько минут просто стоишь."
          effects: { set_flags: [resit_done, resit_passed], inc: { study_progress: 2 }, stress: -15 }
          deltas: { P: 2 }
          skill_xp: { deutsch: 5 }
          leads_to: "академический трек восстановлен"
        - on: fail
          text: "Снова не сдано. Краузе говорит спокойно: «Jetzt müssen wir über Ihren Status sprechen.» (Теперь нам нужно поговорить о вашем статусе.) Это не конец — но это почти конец."
          effects: { set_flags: [resit_done, resit_failed, academic_risk], stress: 25 }
          deltas: { P: -3 }
          dossier: "неудовлетворительная академическая успеваемость"
          leads_to: "виза под угрозой — давление на N6/N9 максимально"
  fallback: { text: "Часы на стене. Листок перед тобой.", reopen: true }

