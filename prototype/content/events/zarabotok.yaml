          effects: { set_flags: [zarabotok_n4_done, knows_priest, has_church_contact], faction: {polish_community: 10}, stress: -15 }
          deltas: { A: 2, P: 1 }
          leads_to: "костёл как хаб — юрист, солидарность, информация"
        - on: always
          text: "Ты отказываешься от объекта и идёшь в церковь. Там — обед, усталые лица, речь по-польски. Ксёндз Марек после: «Здесь ты человек, а не рабочая сила. Юрист во вторник.» Лёгкость — странная, ненадолго, но настоящая."
          effects: { set_flags: [zarabotok_n4_done, knows_priest, has_church_contact], faction: {polish_community: 10}, stress: -15 }
          deltas: { A: 2, P: 1 }
          leads_to: "костёл как хаб — юрист, солидарность, информация"
    - id: zarabotok_n4_extra_shift
      match: { verbs: [work, give, offer_help], honesty: [half_truth, omission] }
      outcomes:
        - on: always
          text: "Ты берёшь объект. 140€ кэшем — настоящие. И ты чуть глубже в схему Януша. Вечером Войтек: «Я не осуждаю. Но теперь ты ему нужен, и это другая цена.»"
          effects: { money: 140, fatigue: 25, set_flags: [zarabotok_n4_done, deeper_in_brigade], leaning: {gray: 2} }
          deltas: { P: -2, L: -2 }
          leads_to: "деньги есть; зависимость от Януша глубже"
  fallback: { text: "Януш ждёт ответа. Обед в церкви в полдень.", reopen: true }

# ---------- ПОВТОРЯЕМЫЕ СМЕНЫ (пул, Акт I) ----------
- id: zarabotok_ev_construction_shift
