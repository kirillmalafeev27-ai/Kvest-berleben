- id: zarabotok_n8_newcomer
  title: "Новенький в бараке"
  category: dilemma
  act: 3
  node: N8
  priority: 68
  once: true
  trigger: scheduled
  day: 65
  entry: { all: [ {flag_not: zarabotok_n8_done} ] }
  stakes: low
  location: overcrowded_flat
  targets: [npc_zemlyak]
  facts:
    - "В барак заехал новенький — молодой поляк, 24 года. Смотрит теми же глазами, что у тебя были в день 1."
    - "Спрашивает про Януша: «Он нормальный?»"
    - "Войтек смотрит на тебя — ты теперь «старожил»."
  intro: "«Пан, а правда, что здесь хорошо платят? Janusze jest dobry człowiek? (Януш хороший человек?)»"
  branches:
    - id: zarabotok_n8_warn
      match: { verbs: [offer_help, talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "«Słuchaj (слушай). Платят. Но следи за конвертом — там бывают сюрпризы. И права у тебя есть, ты гражданин ЕС. Не забывай.» Парень кивает, немного ошарашенный. Войтек из угла: «Brat, правильно.»"
          effects: { set_flags: [zarabotok_n8_done, mirror_warn] }
          deltas: { A: 2, P: 1 }
          leads_to: "ты передал знание; красит эпилог"
    - id: zarabotok_n8_recruit
      match: { verbs: [persuade, deceive], honesty: [lie, half_truth] }
      requires: [ {flag: deeper_in_brigade} ]
      outcomes:
        - on: always
          text: "«Нормальный, нормальный. Заработаешь.» Ты слышишь свой голос и вспоминаешь, что тебе говорили в первый день. Войтек смотрит в окно."
          effects: { set_flags: [zarabotok_n8_done, mirror_recruit], leaning: {crime: 1} }
          deltas: { A: -2, T: -1 }
          leads_to: "ты стал Янушем для кого-то; красит эпилог"
    - id: zarabotok_n8_stay_silent
      match: { verbs: [rest, observe, refuse], tone: [cold, neutral] }
      outcomes:
        - on: always
          text: "Ты молчишь. Новенький ждёт, потом идёт к Янушу сам. Войтек — тоже молчит. «Каждый сам», — наконец говорит он."
          effects: { set_flags: [zarabotok_n8_done, mirror_silent] }
          deltas: { P: -1 }
          leads_to: "солидарность не передана; настроение барака"
  fallback: { text: "Парень смотрит и ждёт.", reopen: true }

# ---------- ДЕНЬ 70: Дополнительные события Акта III ----------
- id: zarabotok_ev_anmeldung_chance
  title: "Адрес есть — бумаги нет"
  category: arc
  act: 3
  priority: 66
  once: true
  trigger: chain
  entry: { all: [ {flag: knows_legal_options}, {flag_not: zarabotok_anmeldung_done} ] }
  stakes: high
  location: buergeramt
  targets: []
  facts:
    - "Ксёндз Марек знает прихожанку, у которой есть официальный адрес для Anmeldung."
    - "Это реальный адрес реального человека — не фейк."
    - "Anmeldung возможна. Нужен термин и 2-3 часа."
  intro: "Ксёндз передаёт бумажку с адресом и номером телефона пани Збышевской."
  branches:
    - id: zarabotok_anmeldung_go
      match: { verbs: [apply, submit_docs, book_appointment, move] }
      outcomes:
        - on: always
          text: "Ты записываешься через сайт в 7 утра — отмена нашлась. Пани Збышевска встречает у двери. Anmeldung оформлена. Реальная. Без фейков. Это меняет всё — страховка, банк, права."
          effects: { money: -15, set_flags: [zarabotok_anmeldung_done, has_real_anmeldung, has_address] }
          deltas: { L: 3, P: 2 }
          skill_xp: { deutsch: 5 }
          leads_to: "легализация быта запущена; концовка ending_legal ближе"
    - id: zarabotok_anmeldung_skip
      match: { verbs: [refuse, rest] }
      outcomes:
        - on: always
          text: "Ты откладываешь. Шанс есть, но сейчас нет сил. Ксёндз не давит: «Бумажка никуда не денется.»"
          leads_to: "шанс остаётся; время идёт"
  fallback: { text: "Бумажка с адресом лежит в кармане.", reopen: true }

# ---------- ДЕНЬ 75: Разговор с Янушем перед концовкой ----------
- id: zarabotok_ev_janusz_reckoning
  title: "Разговор, которого не было"
  category: arc
  act: 3
  priority: 65
  once: true
  trigger: chain
  entry: { all: [ {flag: zarabotok_n3_done}, {day_gte: 75}, {flag_not: zarabotok_janusz_reckoning_done} ] }
  stakes: medium
  location: overcrowded_flat
  targets: [npc_janusz]
  facts:
    - "Три месяца прошло. Ты больше не новичок."
    - "Январь иногда смотрит иначе — не как на расходник, а почти как на человека. Почти."
    - "У него самого — история. Двадцать лет назад он тоже приехал в Берлин без денег."
  intro: "ЯНУШ: «Слушай... ты нормальный работяга. Если бы всё было иначе, я бы...» Он не заканчивает."
  branches:
    - id: zarabotok_janusz_hear
      match: { verbs: [talk, observe, rest], honesty: [truthful], tone: [neutral, polite] }
      outcomes:
        - on: always
          text: "Ты молча слушаешь. Потом: «Я не держу зла. Но ты знаешь, что схема нечестная.» Январь смотрит в сторону. «Ja. Wiem (Да. Знаю).» Этого достаточно."
          effects: { set_flags: [zarabotok_janusz_reckoning_done, janusz_humanized] }
          deltas: { A: 2 }
          leads_to: "Януш не злодей — он тоже жертва системы, ставшей её частью"
    - id: zarabotok_janusz_confront
      match: { verbs: [threaten, refuse, persuade], tone: [aggressive] }
      skill_check: { skill: torg, vs: 35 }
      outcomes:
        - on: success
          text: "Ты говоришь прямо: «Ты меня обокрал. Я знаю это, ты знаешь это.» Январь молчит. Потом: «Бери неделю вперёд.» Это не извинение. Но это деньги."
          effects: { money: 250, set_flags: [zarabotok_janusz_reckoning_done, janusz_paid_partial] }
          deltas: { P: 3, G: 2 }
          leads_to: "частичная компенсация; отношения напряжены но честны"
        - on: fail
          text: "Ты говоришь слишком жёстко. Январь закрывается: «Без меня ты был бы на улице.» Правда в этом есть. Ненависти нет, тупик есть."
          effects: { set_flags: [zarabotok_janusz_reckoning_done] }
          deltas: { G: 3, P: 1 }
  fallback: { text: "Януш смотрит в окно. Пауза затянулась.", reopen: true }

# ---------- N9: Развязка по связке ----------
- id: zarabotok_n9_resolution
  title: "До расплаты"
  category: dilemma
  act: 3
  node: N9
  priority: 98
  once: true
  trigger: scheduled
  day: 88
  entry: { all: [] }
  stakes: extreme
  location: overcrowded_flat
  targets: [npc_janusz, npc_zemlyak, npc_priest_polish]
  facts:
    - "90 дней вышли. Долг — погашен или нет. Тело — держится или нет. Деньги отправлены домой или нет."
    - "Ты гражданин ЕС. Юридически ты свободен уехать или остаться. Практически — всё зависит от накопленного."
    - "Войтек смотрит. Ксёндз Марек знает. Январь ждёт расчёта."
    - "Решение зависит от связки: Anmeldung + страховка + деньги + здоровье + честность + солидарность."
  intro: "Войтек: «Brat, сегодня день расплаты. У каждого свой.»"
  branches:
    # Порядок ВАЖЕН: первый подходящий по requires = концовка
    - id: zarabotok_ending_legal
      match: { verbs: [observe, inspect_self, talk, apply, inquire_status, rest, submit_docs] }
      requires: [ {flag: has_real_anmeldung}, {all_flags: [zarabotok_anmeldung_done]} ]
      outcomes:
        - on: always
          text: "Anmeldung есть. Адрес есть. Ты идёшь в Krankenkasse (больничная касса) — страховка оформлена. Потом — Arbeitsstrich с нормальными бумагами. Грязно, тяжело, небогато. Но — твоё. Ксёндз Марек: «Bóg widzi.» Войтек: «Brat, ты справился». (КОНЦОВКА ①: легализация быта)"
          effects: { set_flags: [ending_legal, game_over] }
          deltas: { P: 2, A: 1 }
          leads_to: "①"
    - id: zarabotok_ending_underground
      match: { verbs: [observe, inspect_self, talk, apply, inquire_status, rest] }
      requires: [ {leaning_gte: {crime: 4}} ]
      outcomes:
        - on: always
          text: "Схема Януша ведёт в другую схему. Серое становится чёрным. Ты уже знаешь людей, которые платят лучше и спрашивают меньше. Барак сменяется другим адресом — ещё менее официальным. Войтек: «Я не сужу. Но звони иногда.» (КОНЦОВКА ③: подполье)"
          effects: { set_flags: [ending_underground, game_over] }
          deltas: { }
          leads_to: "③"
    - id: zarabotok_ending_exit
      match: { verbs: [refuse, observe, inspect_self, talk, rest, move] }
      requires: [ {axis_gte: {P: 35}}, {any_flag: [injured_untreated, injured_no_insurance]} ]
      outcomes:
        - on: always
          text: "Тело сказало «нет» раньше, чем ты успел принять решение. Ты покупаешь билет домой на то, что осталось. В аэропорту — сообщение от Войтека: «Brat, nie wstydź się (не стыдись). Ty wróciłeś jako człowiek (ты вернулся как человек).» Это не поражение — это выбор. (КОНЦОВКА ④: выход с достоинством)"
          effects: { set_flags: [ending_exit, game_over] }
          deltas: { P: 2 }
          leads_to: "④"
    - id: zarabotok_ending_exit_pride
      match: { verbs: [refuse, observe, rest, move, talk] }
      requires: [ {axis_gte: {P: 40}}, {flag_not: gray_firm_scheme} ]
      outcomes:
        - on: always
          text: "Ты не взял фиктивную схему. Не дал себя сломать. Деньги кончились быстрее, чем надеялся — но достоинство цело. Ксёндз Марек провожает тебя: «Ты не проиграл — ты выбрал честно.» Дорога домой. Семья ждёт. (КОНЦОВКА ④: выход с достоинством)"
          effects: { set_flags: [ending_exit, game_over] }
          deltas: { P: 2 }
          leads_to: "④"
    - id: zarabotok_ending_gray
      match: { verbs: [observe, inspect_self, talk, apply, inquire_status, rest, submit_docs, work] }
      requires: [ {any_flag: [gray_firm_scheme, deeper_in_brigade, accepted_brigade_terms]} ]
      outcomes:
        - on: always
          text: "Расплаты нет — она просто перекладывается вперёд. Долг погашен, появился новый. Барак тот же. Деньги идут домой по чуть-чуть. Ты остаёшься — в карусели «заработал-кинули-занял». Войтек: «Добро пожаловать, brat. Так у всех.» (КОНЦОВКА ②: серая карусель)"
          effects: { set_flags: [ending_gray, game_over] }
          deltas: { }
          leads_to: "②"
    - id: zarabotok_ending_gray_default
      match: { verbs: [observe, inspect_self, talk, apply, inquire_status, rest, submit_docs, work, refuse, give, move] }
      outcomes:
        - on: always
          text: "Девяносто дней прошло. Долг почти закрыт. Денег немного отправлено домой. Страховки нет, Anmeldung нет, но ты жив и работаешь. Январь предлагает следующий месяц. Ты киваешь. Ещё один круг. (КОНЦОВКА ②: серая карусель)"
          effects: { set_flags: [ending_gray, game_over] }
          deltas: { }
          leads_to: "②"
  fallback: { text: "Войтек смотрит. «Ну что, brat?»", reopen: true }
