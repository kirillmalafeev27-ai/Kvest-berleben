          leads_to: "долг уменьшается; тело изнашивается постепенно"
        - on: fail
          text: "Тяжело. Но к вечеру — сделано. Деньги те же."
          effects: { money: 65, fatigue: 26, inc: {brigade_shifts: 1} }
          skill_xp: { trud: 3 }
    - id: zarabotok_shift_talk_konstantin
      match: { verbs: [talk, befriend, observe] }
      outcomes:
        - on: always
          text: "В перерыве ты разговариваешь с Константином из Румынии. «Зарплата у тебя?» — «65». У него — 50. «Потому что я румын», — говорит он без злобы, только устало. Прораб иначе считает."
