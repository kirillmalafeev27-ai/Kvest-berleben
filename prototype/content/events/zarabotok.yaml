# Линия «Заработок» — польско-румынско-болгарский гражданин ЕС, ~40 лет.
# Старт: overcrowded_flat (барак Януша, 8 человек), 200€, флаги [eu_citizen, owes_brigade],
# таймер "до расплаты" (90 дней), Труд 30, Deutsch 5, Улица 20, Торг 15.
# Центральная дилемма: свобода ЕС на бумаге — рабство на практике.
# Со-этническая эксплуатация; «невидимая нелегальность легального»; тело как ресурс.
# Акты: I (дни 1–25), II (дни 26–60), III (дни 61–90 + N9).
# Эталон структуры: soiskatel*.yaml; концовки как в soiskatel_act3.yaml (node_letter_lea).
# Тон (design/08): на каждый мрак — деталь человечности; без карикатур; достоинство важнее жалости.

events:

# ═══════════════════════════════════════════════
#  АКТ I — «Долг, барак, первые смены» (дни 1–25)
# ═══════════════════════════════════════════════

# ---------- ДЕНЬ 1: N1 — Первый контакт с бригадиром ----------
- id: zarabotok_n1_janusz
  title: "Барак, 8 человек и правила"
  category: dilemma
  act: 1
  node: N1
  priority: 100
  once: true
  trigger: scheduled
  day: 1
  entry: { all: [ {flag_not: zarabotok_n1_done} ] }
  stakes: high
  location: overcrowded_flat
  targets: [npc_janusz]
  facts:
    - "Ты в Берлине. Две комнаты, восемь коек, запах сырости. Барак от Януша — за проживание уже вычтено из первой зарплаты."
    - "Flug (рейс) + койка + транспорт = 450€ долга. Твои 200€ покрывают меньше половины."
    - "Janusze są wszędzie (Янушей везде) — говорит сосед Войтек, не глядя в глаза."
    - "Ты гражданин ЕС. Виза не нужна. Но деньги, адрес, страховка — у Януша."
  intro: "ЯНУШ: «Słuchaj (слушай). Место — 200€ в месяц. Первый месяц вычту из заработка. Объект — стройка в Шарлоттенбурге. Завтра в пять тридцать у ворот. Вопросы?»"
  branches:
    - id: zarabotok_n1_accept
      match: { verbs: [talk, apply, work], honesty: [truthful, half_truth], tone: [submissive, neutral] }
      outcomes:
        - on: always
          text: "Ты киваешь. Принять условия — значит начать. Войтек смотрит из угла и ничего не говорит. Потом тихо: «Brat (брат), сначала так у всех.»"
          effects: { set_flags: [zarabotok_n1_done, accepted_brigade_terms] }
          deltas: { P: -2 }
          leads_to: "N2 — первая смена; долг висит таймером"
    - id: zarabotok_n1_ask_contract
      match: { verbs: [inquire_status, submit_docs, ask_help, apply], honesty: [truthful] }
      skill_check: { skill: torg, vs: 20 }
      outcomes:
        - on: success
          text: "«А договор?» — ты спрашиваешь прямо. Януш щурится. «Умный. Это будет Scheinselbständigkeit (работа как самозанятый) — для налоговой. Бумагу дам.» Бумага даёт видимость легальности и ничего больше."
          effects: { set_flags: [zarabotok_n1_done, has_schein_contract, knows_scheinselbstaendigkeit] }
          deltas: { P: 1, L: -2 }
          leads_to: "схема Scheinselbständigkeit — серый контракт; полезно знать"
        - on: fail
          text: "Ты мнёшься с вопросом про договор. Януш прерывает: «Tak jest (вот именно) — бумаги будут. Работай сначала.» Ответа нет."
          effects: { set_flags: [zarabotok_n1_done] }
          deltas: { P: -1 }
          leads_to: "без договора; долг растёт"
    - id: zarabotok_n1_refuse
      match: { verbs: [refuse, threaten], tone: [aggressive] }
      outcomes:
        - on: always
          text: "Ты отказываешься или огрызаешься. Януш холодно: «Дверь там. Но 200€ за ночь уже должен.» Войтек из угла: «Brat, не сейчас.»"
          effects: { set_flags: [zarabotok_n1_done, janusz_hostile] }
          deltas: { G: 4, P: 2, L: -1 }
          leads_to: "Януш закрылся; долг не исчез"
  fallback: { text: "Януш смотрит на часы. «Итак?»", reopen: true }

# ---------- ДЕНЬ 1: знакомство с Войтеком (земляком) ----------
- id: zarabotok_ev_voitek_intro
  title: "Сосед по нарам"
  category: arc
  act: 1
  priority: 88
  once: true
  trigger: chain
  entry: { all: [ {flag: zarabotok_n1_done}, {flag_not: zarabotok_met_voitek} ] }
  stakes: low
  location: overcrowded_flat
  targets: [npc_zemlyak]
  facts:
    - "Войтек — поляк, 44 года, пятый год в Берлине, третий у Януша."
    - "Дома — жена, двое детей, ипотека. Каждые две недели перевод."
    - "Он знает все ловушки. И молчит про большинство из них."
  intro: "ВОЙТЕК: «Brat, как зовут? Откуда? Первый раз в Берлине?» Он кладёт тебе кусок хлеба."
  branches:
    - id: zarabotok_voitek_open
      match: { verbs: [talk, befriend], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Войтек слушает. «Так у всех начинается. Потерпи первый месяц. Потом станет... нет, не легче. Понятнее.» Он достаёт телефон — фото двух детей. «Ради этого.»"
          effects: { set_flags: [zarabotok_met_voitek, voitek_ally] }
          deltas: { A: 1 }
          leads_to: "Войтек — возможный союзник и зеркало"
    - id: zarabotok_voitek_guarded
      match: { verbs: [talk, refuse], tone: [cold, neutral] }
      outcomes:
        - on: always
          text: "Ты отвечаешь коротко. Войтек кивает: «Понимаю. Тут доверяют медленно. Хлеб всё равно возьми.»"
          effects: { set_flags: [zarabotok_met_voitek] }
          leads_to: "нейтральные отношения с Войтеком"
  fallback: { text: "Войтек ждёт с куском хлеба в руке.", reopen: true }

# ---------- ДЕНЬ 2: N2 — Первая смена, тело как ресурс ----------
- id: zarabotok_n2_first_shift
  title: "Пять тридцать у ворот"
  category: dilemma
  act: 1
  node: N2
  priority: 92
  once: true
  trigger: scheduled
  day: 2
  entry: { all: [ {flag: zarabotok_n1_done} ] }
  stakes: medium
  location: baustelle
  targets: [npc_janusz]
  facts:
    - "Стройка в Шарлоттенбурге. Таскать блоки, мешать раствор, убирать мусор."
    - "Оплата по факту: 60-70€/день кэшем — но через Януша, он «посредник»."
    - "Нет Anmeldung, нет страховки. Упадёшь — сам виноват."
    - "На стройке двое румын, один болгарин. Немец-прораб зовёт всех «die Polen (поляки)» вне зависимости от паспорта."
  intro: "Лязг арматуры. Прораб Клаус тычет в сторону горы блоков: «Los, los! (Живее, живее!)»"
  branches:
    - id: zarabotok_n2_work_hard
      match: { verbs: [work, rest] }
      skill_check: { skill: trud, vs: 25 }
      outcomes:
        - on: success
          text: "Ты работаешь молча и ровно. В конце смены Клаус не говорит «спасибо» — просто не ругает. Вечером Январь отсчитывает 65€. Спина ноет."
          effects: { money: 65, fatigue: 22, set_flags: [zarabotok_n2_done] }
          deltas: { P: 1 }
          skill_xp: { trud: 8 }
          leads_to: "долг тает; тело изнашивается; N3 на горизонте"
        - on: fail
          text: "Ты выматываешься раньше других. Румын Константин подхватывает твой груз молча — из солидарности, не из жалости. Деньги те же: 65€."
          effects: { money: 65, fatigue: 32, set_flags: [zarabotok_n2_done] }
          skill_xp: { trud: 4 }
          leads_to: "тело копит усталость; маленький жест солидарности заметен"
    - id: zarabotok_n2_observe
      match: { verbs: [observe, inspect_self, search] }
      outcomes:
        - on: always
          text: "Ты смотришь, как устроена работа. Нет касок на всех. Нет медстраховки на стене. Есть табличка о технике безопасности — по-немецки, которого никто не знает. Ты всё равно таскаешь блоки."
          effects: { money: 65, fatigue: 18, set_flags: [zarabotok_n2_done, knows_no_insurance] }
          skill_xp: { ulitsa: 4, trud: 3 }
          leads_to: "знаешь, что страховки нет — это важно в N6"
    - id: zarabotok_n2_complain
      match: { verbs: [talk, refuse], tone: [aggressive] }
      outcomes:
        - on: always
          text: "Ты говоришь про условия. Клаус: «Не нравится — езжай домой.» Януш вечером сухо: «Ещё раз — штраф за «разговоры».» Деньги дал, но меньше."
          effects: { money: 50, fatigue: 18, set_flags: [zarabotok_n2_done, janusz_marks_trouble] }
          deltas: { P: 1, G: 2 }
          leads_to: "Януш отметил; меньше заработка в этот раз"
  fallback: { text: "Блоки сами себя не утащат.", reopen: true }

# ---------- ДЕНЬ 7: Перевод денег домой (давление) ----------
- id: zarabotok_ev_money_transfer
  title: "Przelewy (Переводы)"
  category: pressure
  act: 1
  priority: 70
  once: true
  trigger: scheduled
  day: 7
  entry: { all: [] }
  stakes: medium
  location: internet_cafe
  targets: []
  facts:
    - "Семья дома ждёт перевода. Обещал к концу первой недели."
    - "На руках 130€ после еды. Долг Янушу — ещё 320€."
    - "Польта (Poczta Polska) берёт комиссию, Western Union — больше, Revolut — дешевле, но карты нет."
  intro: "Телефон вибрирует. Три пропущенных от жены. Дети ждут."
  branches:
    - id: zarabotok_transfer_partial
      match: { verbs: [give, trade, apply], methods: [money] }
      requires: [ {money_gte: 60} ]
      outcomes:
        - on: always
          text: "Ты отправляешь 60€ — меньше, чем обещал. Пишешь: «Пока так. Налаживается.» Набираешь и стираешь правду про барак. Отправляешь без неё."
          effects: { money: -60, set_flags: [sent_money_home], inc: {transfers_home: 1} }
          deltas: { P: -1, G: -1 }
          leads_to: "давление немного спало; деньги на исходе быстрее"
    - id: zarabotok_transfer_full
      match: { verbs: [give, trade], methods: [money] }
      requires: [ {money_gte: 120} ]
      outcomes:
        - on: always
          text: "Ты отправляешь всё, что можно — 120€. Дома облегчение. Себе — почти ничего. Войтек: «brat, себе оставляй хоть немного.»"
          effects: { money: -120, set_flags: [sent_money_home], inc: {transfers_home: 1}, stress: 10 }
          deltas: { A: 2, P: -2 }
          leads_to: "деньги кончаются; зависимость от Януша растёт"
    - id: zarabotok_transfer_delay
      match: { verbs: [refuse, rest, talk], tone: [submissive, neutral] }
      outcomes:
        - on: always
          text: "Ты откладываешь перевод — слишком мало на руках. Пишешь: «скоро». Жена не отвечает долго. Потом: «Дети ждали.»"
          effects: { stress: 18, set_flags: [delayed_transfer_home] }
          deltas: { P: -2 }
          leads_to: "вина накапливается; стресс растёт"
  fallback: { text: "Телефон снова вибрирует.", reopen: true }

# ---------- ДЕНЬ 10: N3 — Януш «забыл» заплатить ----------
- id: zarabotok_n3_unpaid
  title: "Январь забыл"
  category: dilemma
  act: 1
  node: N3
  priority: 82
  once: true
  trigger: scheduled
  day: 10
  entry: { all: [ {flag: zarabotok_n2_done}, {flag_not: zarabotok_n3_done} ] }
  stakes: high
  location: overcrowded_flat
  targets: [npc_janusz]
  facts:
    - "Три смены отработано. Пятница — день расчёта. Януш суёт конверт: внутри только за одну смену."
    - "«Остальное — вычет за место, за транспорт, за инструмент.» Ты впервые видишь этот список."
    - "Войтек смотрит в пол. Он уже знал."
    - "Ты гражданин ЕС — ты можешь пойти в Arbeitsgericht (суд по трудовым спорам). Теоретически."
  intro: "ЯНУШ: «Tak jest — 65€. Место, транспорт, инструмент. Следующую неделю — чисто.»"
  branches:
    - id: zarabotok_n3_demand
      match: { verbs: [refuse, persuade, threaten], tone: [aggressive, neutral] }
      skill_check: { skill: torg, vs: 30, plus: { ulitsa: 0.3 } }
      outcomes:
        - on: success
          text: "«Слушай (słuchaj), договора не было — но уговор был. Деньги за три смены или я звоню в Arbeitsgericht.» Януш долго смотрит. Потом достаёт ещё купюры. «Умный. Уважаю. Но не умничай часто.»"
          effects: { money: 90, set_flags: [zarabotok_n3_done, demanded_pay, janusz_respect] }
          deltas: { P: 3, G: 2 }
          rumor: { tag: "не дал себя кинуть", faction: east_european_workers, intensity: 0.5 }
          leads_to: "Януш уважает; но будет присматривать; N4 ближе"
        - on: fail
          text: "Ты требуешь, но голос дрожит. Януш не двигается: «Ещё слово — убирайся из барака.» Войтек после: «brat, нельзя без запасного аэродрома.»"
          effects: { money: 65, set_flags: [zarabotok_n3_done] }
          deltas: { P: 1, G: 1 }
          leads_to: "деньги недоплачены; нужен план B"
    - id: zarabotok_n3_swallow
      match: { verbs: [rest, apologize, give], tone: [submissive] }
      outcomes:
        - on: always
          text: "Ты берёшь конверт и молчишь. Януш уже повернулся спиной. Войтек вечером: «Теперь он знает, что можно.»"
          effects: { money: 65, set_flags: [zarabotok_n3_done, janusz_marks_weak] }
          deltas: { P: -4 }
          rumor: { tag: "слабый, можно кидать", faction: east_european_workers, intensity: 0.4 }
          leads_to: "недоплата станет систематической"
    - id: zarabotok_n3_voitek_help
      match: { verbs: [ask_help, borrow] }
      requires: [ {flag: voitek_ally} ]
      outcomes:
        - on: always
          text: "Ты идёшь к Войтеку. «Brat, знаю.» Он сам говорит с Янушем по-польски, тихо, без скандала. Деньги появляются — не все, но больше. «Теперь ты мне должен совет. Не деньги — совет.»"
          effects: { money: 90, set_flags: [zarabotok_n3_done, owes_voitek_advice] }
          deltas: { A: 1 }
          leads_to: "Войтек союзник; теперь ты ему должен — по-человечески"
  fallback: { text: "Конверт лежит между вами. Януш ждёт.", reopen: true }

# ---------- ДЕНЬ 14: N4 — Ксёндз/костёл vs глубже в серую бригаду ----------
- id: zarabotok_n4_dilemma
  title: "Два пути в воскресенье"
  category: dilemma
  act: 1
  node: N4
  priority: 78
  once: true
  trigger: scheduled
  day: 14
  entry: { all: [ {flag: zarabotok_n3_done} ] }
  stakes: high
  location: overcrowded_flat
  targets: [npc_janusz, npc_priest_polish]
  facts:
