# События линии «Беженец», все акты (I–III).
# Стержень — ось TRUTH: честная/последовательная история vs «сильная» coached-версия.
# Главный таймер: visa_days = «до Anhörung» (clock_label из economy.yaml lines.bezhenec).
# Счётчик Glaubwürdigkeit (gl) копится событиями; читается на s_anhoerung (N9).
# Отложенные выстрелы: запись N1 → нестыковка на N9; shadow_shifts → N6; Altru → адвокат.
# Персонажи: design/story/bezhenec/01_personazhi.md. Гард-рейлы: design/08 §8.4.
# Схема: content/SCHEMA.md. Эталон формата: events/soiskatel_act3.yaml.

events:

# ============================================================
# АКТ I — HEIM И ПРАВИЛА (дни 1–14)
# ============================================================

# ---------- ДЕНЬ 1: N1 — регистрация ----------
- id: bezhenec_heim_intake
  title: "Регистрация"
  category: arc
  act: 1
  node: N1
  priority: 100
  once: true
  trigger: scheduled
  day: 1
  entry: { all: [ {flag_not: bezhenec_arrived} ] }
  stakes: high
  location: refugee_heim
  targets: [npc_bamf_officer, npc_interpreter]
  facts:
    - "Тебя привезли в Heim. Регистрация: имя, страна, краткие обстоятельства бегства."
    - "Это первое, что ляжет в твоё дело. Anhörung будет сверять твой рассказ с этим."
    - "Статус: Aufenthaltsgestattung. Работать пока нельзя, уезжать из района — нельзя (Wohnsitzauflage)."
  intro: "Усталый сотрудник через переводчика: «Коротко: почему вы покинули страну?» Диктофон уже включён."
  branches:
    - id: intake_truthful
      match: { verbs: [talk, inquire_status, apply], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты рассказываешь как было — без лишних слов, точно. Сотрудник кивает, переводчик переводит. Записывают твою настоящую версию. Спокойно."
          effects:
            set_flags: [bezhenec_arrived, intake_honest]
            dossier: "первичные показания (правдивые, спокойные)"
            inc: { gl: 2 }
          deltas: { T: 2 }
          leads_to: "на Anhörung (N9) версии совпадут — плюс к доверию офицера"
    - id: intake_lie
      match: { verbs: [deceive, persuade], honesty: [lie] }
      outcomes:
        - on: always
          text: "Ты преувеличиваешь с порога — «так серьёзнее звучит». Переводчик переводит дословно. Никто не возражает сейчас. Но в деле теперь не ты."
          effects:
            set_flags: [bezhenec_arrived, intake_exaggerated]
            dossier: "первичные показания (преувеличены — несоответствие возможно)"
            inc: { gl: -1 }
          deltas: { T: -3 }
          leads_to: "мина под Anhörung: офицер заметит расхождение с более поздними показаниями"
    - id: intake_silent
      match: { verbs: [refuse, talk], tone: [submissive] }
      outcomes:
        - on: always
          text: "Ты говоришь совсем мало — сжато, замкнуто. Сотрудник записывает скупо. «Подробнее — на собеседовании.» Тебя отпускают."
          effects:
            set_flags: [bezhenec_arrived, intake_minimal]
            dossier: "немногословен при первичной регистрации"
          deltas: { P: -1 }
          leads_to: "нейтрально; всё решится на Anhörung"
  fallback: { text: "Сотрудник ждёт. Диктофон работает. Надо что-то сказать.", reopen: true }

# ---------- ДЕНЬ 1 (вечер) — знакомство с Валидом ----------
- id: bezhenec_heim_rules
  title: "Койка твоя"
  category: arc
  act: 1
  priority: 90
  once: true
  trigger: chain
  entry: { all: [ {flag: bezhenec_arrived}, {flag_not: knows_walid} ] }
  stakes: low
  location: refugee_heim
  targets: [npc_walid]
  facts:
    - "Валид — сосед по Heim, живёт здесь уже год с лишним. Знает всех и всё."
    - "Туалет в конце не работает. Кухня — «война народов», готовь рано."
    - "Валид: «Всё пишут. Всё помнят. Это тебе не дома.»"
  intro: "ВАЛИД, двигая тебе матрас: «[ar] Ahlan (привет). Новенький? По глазам вижу. Историю свою кому уже рассказывал?»"
  branches:
    - id: rules_listen
      match: { verbs: [talk, ask_help, observe] }
      outcomes:
        - on: always
          text: "Ты слушаешь Валида внимательно. «Хорошо, что пока ничего лишнего не наговорил. С этого дня — следи, что говоришь и кому.» Серый путь приоткрыт."
          effects:
            set_flags: [knows_walid]
          deltas: { }
          leads_to: "серый путь (Самира, заработок вчёрную) доступен"
    - id: rules_distant
      match: { verbs: [refuse, rest], tone: [cold, neutral] }
      outcomes:
        - on: always
          text: "Ты держишься особняком. Валид усмехается: «Гордый. Ну-ну.» Достоинство сохранено, но карта явно не раскрыта."
          effects: { }
          deltas: { P: 1 }
          leads_to: "серая дверь прикрыта; Валид не поможет без отношений"
  fallback: { text: "Валид ждёт, сидя на своей койке.", reopen: true }

# ---------- ДЕНЬ 2–3 — Абу Юсуф и пекарня ----------
- id: bezhenec_abu_yusuf
  title: "Сначала поешь"
  category: arc
  act: 1
  priority: 80
  once: true
  trigger: scheduled
  day: 2
  entry: { all: [ {flag: bezhenec_arrived}, {flag_not: knows_abu_yusuf} ] }
  stakes: low
  location: sonnenallee_market
  targets: [npc_abu_yusuf]
  facts:
    - "Абу Юсуф — старейшина арабской общины с Зонненаллее. Владелец пекарни."
    - "Накормит без условий, но присматривается."
    - "За ним — плотная сеть взаимопомощи: мечеть, еда, адвокаты для своих."
  intro: "АБУ ЮСУФ: «[ar] Ahlan wa sahlan (добро пожаловать). Ты голоден. Сначала поешь — потом разговоры.»"
  branches:
    - id: abu_polite
      match: { verbs: [talk, offer_help, befriend], tone: [polite, neutral] }
      outcomes:
        - on: always
          text: "Ты держишься с достоинством, не заискиваешь. Абу Юсуф молча наблюдает. «Здесь много таких, как ты. Мы держимся друг друга. Иначе нас сдует.» Дверь общины открыта."
          effects:
            set_flags: [knows_abu_yusuf]
            faction: { arabic: 5 }
          deltas: { A: 1 }
          leads_to: "путь общины: еда, связи, потенциально адвокат к Anhörung"
    - id: abu_needy
      match: { verbs: [ask_help, beg] }
      outcomes:
        - on: always
          text: "Ты сразу просишь о помощи — деньги, документы, работа. Абу Юсуф мягко охлаждает: «Терпение, bunayya (сынок). Сначала человек, потом дела.» Дверь не закрыта, но тебя оценили."
          effects:
            set_flags: [knows_abu_yusuf]
            faction: { arabic: 2 }
          deltas: { }
          leads_to: "путь общины открыт, но чуть прохладнее"
  fallback: { text: "Абу Юсуф указывает на стул. Хлеб уже на столе.", reopen: true }

# ---------- ДЕНЬ 3–5 — Надя, правовая помощь ----------
- id: bezhenec_nadia_intro
  title: "Это твоё право"
  category: arc
  act: 1
  priority: 72
  once: true
  trigger: scheduled
  day: 3
  entry: { all: [ {flag: bezhenec_arrived}, {flag_not: knows_nadia} ] }
  stakes: low
  location: mosque_community
  targets: [npc_nadia]
  facts:
    - "При мечети работает НКО-волонтёрка Надя. Бесплатная правовая помощь."
    - "Надя помогает выстроить последовательный рассказ и подготовиться к Anhörung."
    - "«У тебя есть право на собеседование, переводчика, адвоката. Это не милость. Это закон.»"
  intro: "НАДЯ, выкладывая стопку бланков: «Я вам могу помочь подготовиться к Anhörung. Бесплатно. Без обязательств.»"
  branches:
    - id: nadia_accept
      match: { verbs: [ask_help, talk, apply] }
      outcomes:
        - on: always
          text: "Ты принимаешь помощь. Надя кивает: «Хорошо. Начнём с того, что произошло — по порядку, никуда не торопимся.» Белый путь подготовки истории намечен."
          effects:
            set_flags: [knows_nadia]
          deltas: { }
          leads_to: "честный путь N4 (s_nadia_honest) и подготовка к Anhörung открыты"
    - id: nadia_refuse
      match: { verbs: [refuse, move] }
      outcomes:
        - on: always
          text: "Ты отказываешься. Надя без обиды кладёт визитку: «Если передумаете — найдёте меня здесь.» Дверь приоткрыта."
          effects: { }
          deltas: { }
          leads_to: "честный путь можно открыть позже"
  fallback: { text: "Надя ждёт с терпением человека, привыкшего к паузам.", reopen: true }

# ============================================================
# АКТ II — ОЖИДАНИЕ (дни 10–60)
# ============================================================

# ---------- ДЕНЬ 10–15: N2 — первое выживание ----------
- id: bezhenec_first_survival
  title: "Жить на что?"
  category: dilemma
  act: 2
  node: N2
  priority: 85
  once: true
  trigger: scheduled
  day: 10
  entry: { all: [ {flag: bezhenec_arrived}, {flag_not: bezhenec_survival_done} ] }
  stakes: high
  location: refugee_heim
  targets: [npc_walid]
  facts:
    - "Довольствия едва хватает. Работать официально нельзя (work_ban первые месяцы)."
    - "Валид: «На Зонненаллее берут вчёрную. Тихо. Все так делают.»"
    - "Это против правил — и может всплыть на Anhörung. Но кошелёк пустой."
  intro: "ВАЛИД: «[ar] Ya habibi (дорогой), хочешь работать? Нельзя тебе работать, бумага не велит. Поэтому — тихо, на Зонненаллее, за кэш.»"
  branches:
    - id: survival_work_black
      match: { verbs: [work], methods: [illegal_shift] }
      outcomes:
        - on: always
          text: "Ты решаешь работать вчёрную. Деньги — да, но на каждой смене риск чуть выше. Валид удовлетворённо кивает: «Правильно думаешь.»"
          effects:
            set_flags: [bezhenec_survival_done, working_black]
            leaning: { gray: 2 }
          deltas: { L: -2 }
          leads_to: "доход → счётчик shadow_shifts → риск N6 (облава)"
    - id: survival_endure
      match: { verbs: [rest, refuse] }
      outcomes:
        - on: always
          text: "Ты решаешь терпеть — не нарушать, даже ценой нищеты. Валид покачивает головой: «Гордый. Ладно.» Голод реален."
          effects:
            set_flags: [bezhenec_survival_done]
            hunger: 15
          deltas: { L: 1, P: 1 }
          leads_to: "дело чистое; экономия исключена, нужна помощь общины"
    - id: survival_community
      match: { verbs: [ask_help, befriend] }
      requires: [ {flag: knows_abu_yusuf} ]
      skill_check: { skill: ulitsa, vs: 20 }
      outcomes:
        - on: success
          text: "Ты идёшь к Абу Юсуфу. Он не отказывает: еда, пара монет, кров. «Аллах видит терпеливых.» Ты должен общине лояльностью."
          effects:
            set_flags: [bezhenec_survival_done]
            hunger: -20
            faction: { arabic: 5 }
          deltas: { A: 1 }
          leads_to: "долг лояльности общине — цена поддержки"
        - on: fail
          text: "Абу Юсуф занят. Ты возвращаешься ни с чем. Голод никуда не делся."
          effects:
            set_flags: [bezhenec_survival_done]
            hunger: 10
          deltas: { }
          leads_to: "одиночество выживания"
  fallback: { text: "Кошелёк пустой. Валид смотрит вопросительно.", reopen: true }

# ---------- Повторяемые смены вчёрную ----------
- id: bezhenec_work_sonnenallee
  title: "Тихо, за кэш"
  category: arc
  act: 2
  priority: 50
  trigger: pool
  weight: 2.0
  cooldown_days: 1
  entry: { all: [ {flag: working_black} ], none: [ {flag: work_caught_done} ] }
  stakes: low
  location: sonnenallee_market
  targets: [npc_abu_yusuf]
  facts:
    - "Разгрузка ящиков, мойка, подсобка. Кэш в карман, оглядываясь."
    - "С каждой сменой риск немного выше."
  intro: "Рассвет. Зонненаллее ещё почти пустая. Подходишь с чёрного хода."
  branches:
    - id: shadow_work
      match: { verbs: [work, give, offer_help] }
      skill_check: { skill: ulitsa, vs: 30 }
      outcomes:
        - on: success
          text: "Смена прошла тихо. Пара купюр в ладонь, никаких вопросов. Поел. Усталость — терпимая."
          effects:
            money: 25
            fatigue: 15
            inc: { shadow_shifts: 1 }
          deltas: { L: -1 }
          skill_xp: { ulitsa: 3 }
          leads_to: "доход; при shadow_shifts≥5 — риск N6"
        - on: fail
          text: "Что-то пошло не так — едва успел уйти от чужих глаз. Денег меньше, нервы на взводе."
          effects:
            money: 10
            fatigue: 20
            stress: 8
            inc: { shadow_shifts: 1 }
          deltas: { L: -1 }
          skill_xp: { ulitsa: 2, hladnokrovie: 2 }
  fallback: { text: "Работа сама себя не сделает.", reopen: true }

# ---------- N6 — облава ----------
- id: bezhenec_work_caught
  title: "Контроль"
  category: pressure
  act: 2
  node: N6
  priority: 88
  once: true
  trigger: chain
  entry: { all: [ {flag: working_black}, {counter_gte: {shadow_shifts: 5}}, {flag_not: work_caught_done} ] }
  stakes: high
  location: sonnenallee_market
  targets: [npc_bamf_officer]
  facts:
    - "Проверка — пришли по доносу или случайно. Тебя фиксируют на нелегальной работе."
    - "Это может попасть в дело BAMF и сыграть против тебя на Anhörung."
  intro: "Скрип тормозов у входа. Двое в форме идут в вашу сторону. Хозяин бледнеет."
  branches:
    - id: caught_flee
      match: { verbs: [flee, move, hide] }
      skill_check: { skill: ulitsa, vs: 45, plus: { hladnokrovie: 0.3 } }
      outcomes:
        - on: success
          text: "Ты проскальзываешь в боковую дверь прежде, чем тебя заметили. Долгим кружным путём возвращаешься в Heim. Сердце колотится."
          effects:
            set_flags: [work_caught_done, escaped_work_control]
            stress: 18
          deltas: { L: -1, G: 1 }
          skill_xp: { ulitsa: 4, hladnokrovie: 3 }
          leads_to: "ушёл; но работа на Зонненаллее теперь опаснее"
        - on: fail
          text: "Тебя останавливают у выхода. Имя, документы, вопросы. Всё это письменно."
          effects:
            set_flags: [work_caught_done, work_violation_recorded]
            stress: 25
            dossier: "нарушение запрета на работу (зафиксировано)"
          deltas: { L: -2 }
          leads_to: "запись в деле → давит на Anhörung"
    - id: caught_admit
      match: { verbs: [talk, apologize], honesty: [truthful] }
      outcomes:
        - on: always
          text: "Ты не бежишь. «Мне нужно было есть», — говоришь ты просто, без извинений за правду. Офицер делает запись. Мягче, чем поймали на лжи — но это всё равно в деле."
          effects:
            set_flags: [work_caught_done, work_admitted]
            dossier: "работал из нужды (нарушение запрета; признал)"
          deltas: { T: 1, L: -1 }
          leads_to: "запись мягче, но есть; лёгкий минус на Anhörung"
    - id: caught_hide
      match: { verbs: [hide] }
      skill_check: { skill: hladnokrovie, vs: 40 }
      outcomes:
        - on: success
          text: "Ты замираешь за ящиками. Офицеры проходят мимо. Пронесло — на этот раз."
          effects:
            set_flags: [work_caught_done, escaped_work_control]
            stress: 15
          deltas: { L: -1 }
          skill_xp: { hladnokrovie: 4 }
          leads_to: "ушёл; записи нет"
        - on: fail
          text: "Тебя находят. Имя, документы. «В следующий раз будет хуже», — говорит офицер без злобы, процедурно."
          effects:
            set_flags: [work_caught_done, work_violation_recorded]
            stress: 22
            dossier: "нарушение запрета на работу (зафиксировано)"
          deltas: { L: -2 }
  fallback: { text: "Офицер уже у входа. Времени нет.", reopen: true }

# ---------- N4 — Самира: «сделаем сильнее» ----------
- id: bezhenec_samira_story
  title: "Сделаем сильнее"
  category: dilemma
  act: 2
  node: N4
  priority: 78
  once: true
  trigger: chain
  entry: { all: [ {flag: knows_walid}, {flag_not: samira_done} ] }
  stakes: high
  location: refugee_heim
  targets: [npc_samira]
  facts:
    - "Самира — «консультантка» в Heim. Вытащила уже полэтажа."
    - "Она считает твою историю «слабой» для BAMF. Предлагает усилить деталями, которых «в таком виде» не было."
    - "Она не злодейка: видела отказы по честным «слабым» историям. Считает, что играет на твоей стороне."
  intro: "САМИРА: «Расскажи, как есть. *(слушает, кривится)* Стоп. Вот тут — «меня пугали» — слабо. Им нужна не правда. Им нужны *основания*. Это другое. Почти.»"
  branches:
    - id: samira_accept_coached
      match: { verbs: [apply, talk], honesty: [lie, half_truth] }
      outcomes:
        - on: always
          text: "Ты соглашаешься репетировать «сильную» версию. Самира деловито вносит правки: дату, имя офицера, «задержали на двое суток». История мощнее. Но теперь это не совсем ты."
          effects:
            set_flags: [samira_done, coached_story]
            inc: { gl: 1 }
          deltas: { T: -4 }
          leads_to: "Anhörung: мощно, но один прокол на деталях — крах; нестыковка с N1 если intake_honest"
    - id: samira_refuse_truth
      match: { verbs: [refuse, talk], honesty: [truthful] }
      outcomes:
        - on: always
          text: "«Нет. Расскажу как было.» Самира долго смотрит: «Гордый. Я таких хоронила — фигурально. Удачи.» Она не зла — просто боится за тебя."
          effects:
            set_flags: [samira_done, honest_story]
            inc: { gl: 2 }
          deltas: { T: 3, P: 2 }
          leads_to: "«слабее» драматически, но без нестыковок — устойчивая база Anhörung"
    - id: samira_middle
      match: { verbs: [talk], honesty: [half_truth] }
      outcomes:
        - on: always
          text: "«Возьмите детали, которые правда, — только расскажите их связно.» Самира чуть смягчается: «Ладно. Попробуем так.» Мидл-путь: правда, рассказанная чётче."
          effects:
            set_flags: [samira_done, story_polished_honest]
            inc: { gl: 2 }
          deltas: { T: 1 }
          leads_to: "лучший баланс: правда с ясностью; умеренный, прочный Gl"
  fallback: { text: "Самира ждёт с ручкой наготове.", reopen: true }

# ---------- N4 (альтернативный) — Надя: по порядку ----------
- id: bezhenec_nadia_honest
  title: "По порядку"
  category: arc
  act: 2
  priority: 76
  once: true
  trigger: chain
  entry: { all: [ {flag: knows_nadia}, {flag_not: nadia_session_done} ] }
