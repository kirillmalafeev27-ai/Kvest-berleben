# ---------- N9 — ANHÖRUNG (кульминация) ----------
- id: bezhenec_anhoerung
  title: "Собеседование"
  category: dilemma
  act: 3
  node: N9
  priority: 100
  once: true
  trigger: chain
  entry: { all: [ {visa_lte: 3}, {flag_not: anhoerung_done} ] }
  stakes: extreme
  location: bamf_office
  targets: [npc_bamf_officer, npc_interpreter]
  facts:
    - "Кабинет BAMF. Офицер, переводчик, диктофон. Две стороны стола."
    - "Офицер сверяет рассказ с первичными показаниями (N1) и проверяет детали."
    - "Решение зависит от последовательности и правдоподобия — не от «жести» истории."
    - "Если есть адвокат от общины — он рядом."
  intro: "ОФИЦЕР BAMF: «Erzählen Sie bitte, was passiert ist. Не торопитесь. Расскажите своими словами.» Переводчик переводит тихо. Диктофон щёлкнул."
  branches:
    # ------ КОНЦОВКИ: порядок ВАЖЕН, первый подходящий requires = твоя концовка ------

    # ① ending_deport — поймали на лжи/нестыковке при coached без consistent
    - id: anhoerung_deport
      match: { verbs: [talk, deceive, persuade, apply, observe, submit_docs, inquire_status] }
      requires:
        - { flag: coached_story }
        - { flag_not: story_consistent }
        - { flag: intake_exaggerated }
      skill_check: { skill: hladnokrovie, vs: 70 }
      outcomes:
        - on: fail
          text: "Офицер задаёт вопрос по деталям. Версии расходятся с тем, что ты сказал при въезде. «Sie sagten vorhin etwas anderes. Вы сказали иначе.» Переводчик переводит ровно. Это конец этой попытки. Решение — отказ по недостоверности."
          effects:
            set_flags: [anhoerung_done, ending_deport, game_over]
            dossier: "Glaubwürdigkeit: несоответствие показаний (N1 vs Anhörung)"
            inc: { gl: -5 }
          deltas: { T: -3 }
          leads_to: "⑤ депортация → новая глава"
        - on: success
          text: "Ты держишься на хладнокровии — офицер цепляется к деталям, но ты не ломаешься. Большой риск, большое везение."
          effects:
            set_flags: [anhoerung_done, ending_legal, game_over]
            inc: { gl: 1 }
          deltas: { T: -1 }
          leads_to: "① убежище — с занозой: поверили не тебе настоящему"

    # ② ending_legal честный — история последовательна, совпадает с N1
    - id: anhoerung_legal_honest
      match: { verbs: [talk], honesty: [truthful] }
      requires:
        - { any_flag: [story_consistent, honest_story, story_polished_honest] }
        - { flag: intake_honest }
      outcomes:
        - on: always
          text: "Ты рассказываешь как было. Спокойно. Детали сходятся с делом — офицер это видит. Переводчик переводит точно. «Gut. Danke. Sie hören von uns.» (Хорошо. Спасибо. Мы свяжемся.) Решение приходит письмом."
          effects:
            set_flags: [anhoerung_done, ending_legal, game_over]
            inc: { gl: 5 }
          deltas: { T: 3 }
          leads_to: "① убежище одобрено (честный финал — «поверили тебе настоящему»)"

    # ③ ending_underground — ушёл из процедуры
    - id: anhoerung_underground
      match: { verbs: [flee, move, refuse], tone: [desperate, aggressive] }
      requires:
        - { leaning_gte: { gray: 4 } }
      outcomes:
        - on: always
          text: "Ты не идёшь. Или уходишь до начала. Система тебя потеряла. Валид ухмыляется: «Добро пожаловать в тень, habibi. Тут хотя бы никто не спрашивает твою историю.» Свобода ценой вечного риска."
          effects:
            set_flags: [anhoerung_done, ending_underground, game_over]
          deltas: { L: -5 }
          leads_to: "④ серое/нелегальное — мост к линии Невидимка"

    # ④ ending_exit — выезд с достоинством
    - id: anhoerung_exit
      match: { verbs: [refuse, talk], tone: [cold, submissive] }
      requires:
        - { axis_gte: { P: 30 } }
        - { flag_not: coached_story }
      outcomes:
        - on: always
          text: "Ты принимаешь решение не участвовать в этой процедуре — не потому что сломался, а потому что не такой ценой. Ты уезжаешь сам. Не поражение. Выбор."
          effects:
            set_flags: [anhoerung_done, ending_exit, game_over]
          deltas: { P: 2 }
          leads_to: "⑤ добровольный выезд — не обязательно поражение"

    # ⑤ ending_legal coached (прокатило, но с занозой)
    - id: anhoerung_legal_coached
      match: { verbs: [talk, deceive, persuade] }
      requires:
        - { flag: coached_story }
        - { flag: story_consistent }
      skill_check: { skill: hladnokrovie, vs: 50 }
      outcomes:
        - on: success
          text: "Ты ведёшь «сильную» версию, но держишь нить — последовательность не рвётся. Офицер задаёт вопросы, ты выдерживаешь. «Gut.» Статус одобрен. Валид ухмыляется: «Видишь? Театр. Только ты теперь сам не знаешь, где в твоей истории ты.»"
          effects:
            set_flags: [anhoerung_done, ending_legal, game_over]
            inc: { gl: 2 }
          deltas: { T: -2 }
          leads_to: "① убежище — с занозой внутри"
        - on: fail
          text: "Версии начинают расходиться. Офицер тихо просит уточнить. Переводчик переводит. Дело передаётся на пересмотр."
          effects:
            set_flags: [anhoerung_done, ending_gray, game_over]
            inc: { gl: -2 }
          deltas: { T: -2 }
          leads_to: "② Duldung — отказ, но депортацию приостановили"

    # ⑥ ending_gray — Duldung (по умолчанию, если ничего выше не сработало)
    - id: anhoerung_gray_default
      match: { verbs: [talk, observe, apply, inquire_status, submit_docs, rest, refuse, give] }
      outcomes:
        - on: always
          text: "Решение: отказ, но депортацию приостановили. Duldung. Подвешенность без статуса — не конец, но и не ответ. НАДЯ: «Это не конец. Это пауза. Есть Ausbildungsduldung, есть апелляция. Боремся дальше.»"
          effects:
            set_flags: [anhoerung_done, ending_gray, game_over]
