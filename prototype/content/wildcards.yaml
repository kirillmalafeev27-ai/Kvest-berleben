# Универсальные реакции «мир отвечает на ЧТО УГОДНО» (design/00_baza_v0.1 §1.1, §4.2).
# Срабатывают, когда интент игрока НЕ подходит ни к одной ветке текущей сцены ИЛИ игрок
# делает дикое/неожиданное действие в вольном режиме. Цель: откликнуться внутри мира,
# не сломать погружение и МЯГКО вернуть к сюжету (steer). Считается выбор, не успех:
# попытка насилия/кражи всё равно двигает оси.
#
# Шаблоны: {npc} — имя собеседника (или «никто»), {place} — локация, {hint} — подсказка сцены.
# by_location: реакция по группе локации (state|community_hub|housing|ubahn) — иначе default.

defaults:
  steer: "{hint}"
  unknown_reaction: "«Wie bitte?» — на тебя смотрят с недоумением. Похоже, это ни к чему не ведёт."

wildcards:

  attack:
    by_location:
      state: "Ты вскидываешься — но охранник уже рядом: «Ruhig! Beruhigen Sie sich!» Кулаками тут добиваешься только одного: записи в деле и конца всем шансам."
      community_hub: "Ты замахиваешься — и десяток глаз на рынке тут же поворачивается к тебе. Драка здесь? Завтра об этом будет знать вся улица."
      ubahn: "Ты дёргаешься в драку — пассажиры шарахаются, кто-то уже тянется к кнопке экстренной связи."
    default: "Ты сжимаешь кулаки. {npc} отшатывается. Но насилие тут ничего не решит — только наживёшь врага и беду."
    deltas: { G: 4, L: -2 }
    effects: { stress: 8, rumor: { tag: "вспыльчивый", faction: neighbors, intensity: 0.4 } }
    steer: "Ярость придётся проглотить. {hint}"

  steal:
    by_location:
      state: "Прикарманить что-то прямо в ведомстве? Камеры, очередь, охрана — самоубийственно."
      community_hub: "Стащить на глазах у общины — да тебя потом сюда на порог не пустят."
    default: "Рука тянется к чужому. Но не здесь и не сейчас — слишком много глаз. Попадёшься — и репутации конец."
    deltas: { L: -3 }
    effects: { stress: 6 }
    steer: "Не тот момент для такого. {hint}"

  threaten:
    default: "Ты переходишь на угрозы. {npc} холодеет — но это лишь портит дело, а не решает его."
    by_location:
      state: "Угрозы чиновнику? Это прямая дорога к пометке «агрессивен» в твоём деле."
    deltas: { G: 3, P: 1 }
    effects: { rumor: { tag: "со скандалом", faction: neighbors, intensity: 0.3 } }
    steer: "Силой тут не продавить. {hint}"

  bribe:
    by_location:
      state: "Ты намекаешь на «благодарность». {npc} делает вид, что не услышал — а в Германии это статья."
    default: "Деньгами эту дверь не открыть. {npc} непонимающе смотрит на твою руку."
    deltas: { L: -1, T: -1 }
    steer: "Купить выход не выйдет. {hint}"

  flee:
    default: "Ты порываешься сбежать. Но дело само не рассосётся — рано или поздно к нему придётся вернуться."
    steer: "Убежать от этого нельзя. {hint}"

  hide:
    default: "Ты вжимаешься в стену, будто можешь исчезнуть. Не выйдет — придётся встретить это лицом."
    steer: "Спрятаться не получится. {hint}"

  flirt:
    default: "Ты пробуешь обаять {npc}. Момент явно не тот — тебе мягко, но ясно дают это понять."
    steer: "Не время для этого. {hint}"
    effects: { stress: 2 }

  beg:
    default: "Ты начинаешь умолять. {npc} отводит глаза — жалость тут не та валюта, что решает."
    deltas: { P: -1 }
    steer: "Мольбы не помогут. {hint}"

  deceive:
    default: "Ты сочиняешь на ходу нечто несвязное. {npc} щурится — ложь невпопад только подрывает доверие."
    deltas: { T: -1 }
    steer: "Эта выдумка ни к чему не ведёт. {hint}"

  give:
    default: "Ты суёшь {npc} что-то ни с того ни с сего. Тебя не понимают: к чему это?"
    steer: "Жест мимо. {hint}"

  rest:
    default: "Спать сейчас? {npc} ждёт ответа — момент не отпускает."
    steer: "Передохнуть успеешь потом. {hint}"

  search:
    default: "Ты шаришь вокруг, но ничего полезного для этой ситуации не находишь."
    steer: "{hint}"

  # абсурд / нераспознанное (низкая уверенность парсера)
  unknown:
    default: "Ты делаешь нечто неожиданное. {npc} смотрит на тебя с недоумением: «Wie bitte?»"
    steer: "Это ни к чему не ведёт. {hint}"

# Реакции в ВОЛЬНОМ режиме (нет активной сцены) — мир всё равно живой.
free_roam:
  attack:
    default: "Ты срываешься на прохожего. Тот шарахается, кто-то кричит. Берлин не прощает таких вспышек — улица запоминает."
    deltas: { G: 4, L: -2 }
    effects: { stress: 8, rumor: { tag: "опасный", faction: neighbors, intensity: 0.5 } }
  steal:
    default: "Ты пытаешься что-то стащить на улице. Сердце колотится — но это скользкая дорожка."
    deltas: { L: -3 }
    effects: { stress: 6 }
  flirt:
    default: "Ты заговариваешь с незнакомцем. Лёгкая улыбка в ответ — и ничего больше. Город спешит мимо."
  unknown:
    default: "Ты делаешь что-то странное посреди улицы. Прохожие обходят тебя стороной."
  default_steer: "Можно осмотреться (/look), пойти куда-то (/map, /goto) или закончить день (/next)."
