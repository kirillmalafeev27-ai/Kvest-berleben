# Закрытый словарь глаголов (v0.1 §1.3) + русские ключи для офлайн-парсера-заглушки.
# Парсер сканирует ввод в нижнем регистре на подстроки из `ru`. Реальный Claude-парсер
# использует этот же список как закрытый каталог (см. berlin/parser.py).

verbs:
  observe:      { ru: [осмотр, оглядыв, смотрю по сторон, оцениваю обстанов, что вокруг, озираюсь] }
  inspect_self: { ru: [карман, проверяю себя, что у меня, инвентар, свои документ, что в сумке, состояние] }
  talk:         { methods: [casual, probe_info, gossip], ru: [говорю, болтаю, разговор, спрашиваю, здоров, общаюсь, расспраш, рассказыва, отвеча, объясня, поясня, описываю ситуац] }
  persuade:     { methods: [logic, emotional_appeal, authority_claim, pity], ru: [убежда, уговар, объясняю что, войти в положение, доказываю, настаива, требу] }
  deceive:      { methods: [false_identity, false_story, fake_document_verbal], ru: [вру, обманыва, сочиня, придумыва истор, заливаю, наплету, прикидыва] }
  threaten:     { methods: [violence, exposure, report_to_authority], ru: [угрожа, грожу, пугаю, шантаж, жалобу напишу, накатаю заяв, убью, прирежу, изобью, пожалеешь, расправ] }
  bribe:        { methods: [money, favor, gift], ru: [взятк, сую деньг, кладу на стойк, денег за то, на лапу, отблагодарю деньг] }
  beg:          { ru: [умоляю, милостын, выпрашива, христа ради, побира] }
  befriend:     { ru: [завожу дружб, сближа, налажива отношен, комплимент, втираюсь в довер] }
  ask_help:     { ru: [прошу помощ, за помощью, помогите, помоч, выручи, обращаюсь к] }
  offer_help:   { methods: [labor, translation, money, protection], ru: [помогаю, предлагаю помощь, подсоб, донести, переведу, прикрою] }
  flirt:        { ru: [флирт, заигрыв, знакомлюсь романт, подкатыва, ухажива, целую, обнима, соблазня] }
  apologize:    { ru: [извин, прошу прощен, виноват, сожалею] }
  refuse:       { methods: [polite, firm, rude], ru: [отказыва, не буду, не согласен, нет уж, посылаю, откажусь] }
  trade:        { methods: [buy, sell, haggle], ru: [покупа, продаю, торгу, плачу за, беру за деньг, сбыва] }
  work:         { methods: [legal_shift, illegal_shift, gig], ru: [работа, на смену, берусь за работ, пашу, вкалыва, подрабат, иду пахать] }
  steal:        { methods: [pickpocket, shoplift, scam], ru: [краду, ворую, тырю, обчища, стащу, развед на деньг, выхватыва, граблю, кража, хватаю и бег] }
  borrow:       { methods: [from_npc, from_institution], ru: [занимаю, в долг, одолж, перехвати деньг] }
  give:         { methods: [money, item], ru: [даю, отдаю, возвращаю долг, дарю, делюсь, плачу, оплачива, вношу] }
  apply:        { ru: [подаю заявлен, подаю на, оформля, заполняю заявл] }
  submit_docs:  { methods: [genuine, forged, incomplete], ru: [подаю документ, показываю документ, предъявля бумаг, сдаю справк, даю паспорт] }
  book_appointment: { methods: [online, in_person, through_fixer], ru: [записыва на термин, беру термин, ищу запис, термин на anmeldung] }
  inquire_status:   { ru: [о статусе, как мое дело, справля, узнаю что с] }
  move:         { methods: [walk, transit_paid, transit_fare_dodge, taxi], ru: [иду, еду, перемеща, захожу зайц, без билет, на метро, на автобус, ухожу в] }
  attack:       { methods: [punch, grapple, weapon], ru: [бью, нападаю, дерусь, ударя, врезаю, кидаюсь на, души, ломаю, крушу, разношу, поджига, пинаю, толкаю, кулак, в морду, в лицо, избива, хватаю за] }
  flee:         { ru: [бегу, убега, сбега, спасаюсь бегств, делаю ноги, рву когт] }
  hide:         { ru: [прячусь, скрыва, затаива, прижимаюсь к, ухожу с глаз] }
  search:       { methods: [area, container, person], ru: [ищу, обыскива, шарю, роюсь, прочесыва] }
  rest:         { methods: [sleep, eat, idle], ru: [отдыха, сплю, ложусь спать, ем, поесть, бездельнича, конец дня, заканчиваю день] }

# Маркеры честности (honesty): truthful | half_truth | lie | omission
honesty:
  truthful:  [честно, по правде, правду, как есть, не вру]
  lie:       [вру, ложь, обманыв, сочин, придумыва, заливаю, наплету, прикидыва]
  half_truth: [полуправд, не всю правд, умалчива об одном]
  omission:  [умалчива, не упомина, скрываю что]

# Маркеры тона (tone)
tone:
  polite:     [вежлив, учтив, с уважением, пожалуйста]
  aggressive: [ору, грубо, агрессивн, зло, хамлю, на повышен]
  submissive: [покорно, робко, тихо, заискива, голову склон]
  sarcastic:  [саркаст, с издёвк, ехидно, насмешл]
  desperate:  [отчаянн, в панике, со слезам, умоляюще]
  charming:   [обаятельн, с улыбк, очаровыва, мягко]
  cold:       [холодно, сухо, бесстрастн, ледян]
  neutral:    []
